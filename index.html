<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>召喚英雄 - 七宗罪戰術對戰</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html {
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      height: 100%;
    }

    body {
      background-color: #0d0d11;
      color: #e0e0e0;
      font-family: 'Times New Roman', serif, STHeiti, "Microsoft JhengHei";
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    .game-container {
      width: 540px;
      height: 940px;
      background: #181513;
      border: 4px solid #3b2d23;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 15px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      background-image: radial-gradient(circle at 50% 50%, #2a201a 0%, #110d0b 100%);
      --speed: 1;
      transform-origin: center center;
      transition: transform 0.15s ease-out;
      flex-shrink: 0;
      overflow: hidden;
    }

    #screen-battle {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 頂部行動排序列 (固定顯示 5 名) */
    .timeline-vertical-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
      justify-content: center;
      width: 34px;
      flex-shrink: 0;
    }

    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }

    .timeline-item {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border: 1.5px solid #333;
      background: rgba(255,255,255,0.05);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .timeline-item.active {
      border-color: #ffd700;
      box-shadow: 0 0 8px #ffd700;
      transform: scale(1.08);
      z-index: 2;
    }

    .timeline-item.player { box-shadow: inset 0 0 0 2px #3b82f6; }
    .timeline-item.enemy { box-shadow: inset 0 0 0 2px #ef4444; }
    .timeline-item.active.player, .timeline-item.active.enemy { box-shadow: 0 0 10px #ffd700; }

    .timeline-item.dead { opacity: 0.35; filter: grayscale(100%); }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.6);
      border: 1px solid #4a382c;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #cbb392;
    }

    /* 水晶血量 */
    .crystal-box {
      background: rgba(0,0,0,0.4);
      padding: 4px;
      border-radius: 6px;
      margin: 4px 0;
      border: 1px solid #3d2f24;
      position: relative;
    }

    /* 召喚水晶圖示 */
    .crystal-art-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px 0 2px;
      background: radial-gradient(circle, rgba(60,110,140,0.18) 0%, rgba(0,0,0,0) 70%);
    }
    .crystal-art-wrap svg {
      width: 55px;
      height: 55px;
      animation: crystalFloat 3s ease-in-out infinite;
    }
    @keyframes crystalFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .bar-container {
      width: 100%;
      height: 16px;
      background: #111;
      border: 1px solid #5a4638;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin: 2px 0;
    }

    .fill-bar {
      height: 100%;
      transition: width calc(0.3s / var(--speed)) ease-out;
    }

    .crystal-hp-enemy { background: linear-gradient(90deg, #801212, #e63946); }
    .crystal-hp-player { background: linear-gradient(90deg, #1d4ed8, #3b82f6); }

    .bar-text {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }

    /* 卡牌風格 */
    .card-row {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      height: 220px;
      position: relative;
    }

    .card {
      flex: 1;
      background: #1f1b18;
      border: 1px solid #4a3e35;
      border-radius: 12px 12px 6px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .card.player { border-top: 3px solid #3b82f6; }
    .card.enemy { border-top: 3px solid #ef4444; }

    .card.active {
      border-color: #ffd700 !important;
      box-shadow: 0 0 10px #ffd700;
      transform: translateY(-4px);
    }

    .card.targetable {
      border-color: #ff4500 !important;
      animation: targetPulse 1s infinite alternate;
    }

    .card.selected {
      border-color: #22c55e !important;
      box-shadow: 0 0 10px #22c55e;
      animation: none;
      opacity: 0.75;
    }

    /* 隨機技能：預覽階段標示「可能施放對象」的候選池(藍框) */
    .card.preview-random {
      border-color: #3b82f6 !important;
      animation: previewPulse-blue 0.5s infinite alternate;
    }
    /* 全體技能：預覽階段標示「必定全部命中」的對象(紅框) */
    .card.preview-all {
      border-color: #ef4444 !important;
      animation: previewPulse-red 0.5s infinite alternate;
    }
    @keyframes previewPulse-blue {
      0% { box-shadow: 0 0 4px #3b82f6; }
      100% { box-shadow: 0 0 14px #3b82f6; }
    }
    @keyframes previewPulse-red {
      0% { box-shadow: 0 0 4px #ef4444; }
      100% { box-shadow: 0 0 14px #ef4444; }
    }

    /* 隨機/全體技能的目標蓋板：覆蓋整排候選對象，玩家點擊蓋板才會觸發實際判定 */
    .target-mask {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 8, 6, 0.68);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
      cursor: pointer;
      animation: fadeIn 0.2s ease-out forwards;
    }
    .target-mask-label {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-align: center;
      line-height: 1.3;
      padding: 0 4px;
      text-shadow: 0 0 10px #000, 0 0 6px #ffd700;
    }
    .target-mask.mask-all .target-mask-label { color: #ffb3b3; text-shadow: 0 0 10px #000, 0 0 8px #ef4444; }
    .target-mask.mask-random .target-mask-label { color: #bcd8ff; text-shadow: 0 0 10px #000, 0 0 8px #3b82f6; }

    @keyframes targetPulse {
      0% { box-shadow: 0 0 4px #ff4500; }
      100% { box-shadow: 0 0 12px #ff4500; }
    }

    .card.dead {
      filter: grayscale(100%) brightness(0.3);
      border-color: #555 !important;
    }

    /* 換位功能允許選擇死亡的隊友，需確保可選標示不被死亡樣式蓋掉 */
    .card.dead.targetable {
      border-color: #ff4500 !important;
      filter: grayscale(60%) brightness(0.6);
    }

    .hero-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border: 2px solid #5a4638;
      margin: 2px 0;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
      background-size: cover;
      position: relative;
    }

    /* 定位標示(坦/補/打)：貼在頭像左斜上方的小圓章 */
    .position-badge {
      position: absolute;
      top: -5px;
      left: -5px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #17130f;
      border: 1px solid rgba(255,255,255,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      line-height: 1;
      z-index: 4;
      box-shadow: 0 0 3px rgba(0,0,0,0.8);
    }
    .position-badge.badge-sm {
      width: 12px;
      height: 12px;
      font-size: 7px;
      top: -3px;
      left: -3px;
    }

    .revive-tag {
      position: absolute;
      top: 35%;
      background: rgba(180, 0, 0, 0.85);
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px solid #ff4444;
      text-align: center;
      z-index: 5;
    }


    .card-name {
      font-size: 11px;
      color: #e5d4c0;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* BUFF 容器 */
    .buff-container {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      justify-content: center;
      width: 100%;
      min-height: 18px;
      margin: 2px 0;
    }

    .buff-icon {
      font-size: 9px;
      font-weight: bold;
      padding: 1px 3px;
      border-radius: 3px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 0 3px rgba(0,0,0,0.5);
    }
    .buff-up { background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 100%); border-color: #81c784; }
    .buff-down { background: linear-gradient(180deg, #c62828 0%, #8e0000 100%); border-color: #e57373; }

    /* HP & MP 條 */
    .unit-status-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mini-bar {
      width: 100%;
      height: 12px;
      background: #000;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      border: 1px solid #444;
    }
    .mini-fill-hp { background: #dc2626; height: 100%; float: left; }
    .mini-fill-shield { background: #ffffff; height: 100%; float: left; opacity: 0.9; }
    .mini-fill-mp { background: #2563eb; height: 100%; }
    .mini-bar-agi {
      height: 5px;
      border-width: 1px;
    }
    .mini-fill-agi {
      background: linear-gradient(90deg, #f59e0b, #ffd700);
      height: 100%;
      transition: width calc(0.3s / var(--speed)) ease-out;
    }
    .mini-text {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      font-size: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      text-shadow: 1px 1px 1px #000;
    }

    /* 戰場日誌 */
    .battle-grid {
      flex: 1;
      background: radial-gradient(circle, rgba(40,32,26,0.6) 0%, rgba(15,12,10,0.9) 100%);
      border: 1px solid #3b2d23;
      margin: 6px 0;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      gap: 8px;
      padding: 8px;
    }

    .log-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      min-height: 0;
    }

    .log-header {
      display: flex;
      justify-content: flex-end;
      padding: 0 2px;
      flex-shrink: 0;
    }

    .log-header-text {
      color: #ffb347;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 0 4px #000;
    }

    .log-box-wrap {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
    }

    .log-box {
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      border: 1px solid #4a3e35;
      border-radius: 6px;
      padding: 6px;
      overflow-y: auto;
      font-size: 11px;
      color: #bfa88e;
      z-index: 2;
    }

    /* 移至戰場日誌下方的自動戰鬥按鈕 */
    .btn-auto-float {
      align-self: flex-end;
      flex-shrink: 0;
      width: 40%;
      min-width: 62px;
      padding: 8px 2px;
      font-size: 9px;
      line-height: 1.3;
      text-align: center;
      background: linear-gradient(180deg, #4a3c31 0%, #292019 100%);
      border: 1px solid #7a6350;
      border-radius: 6px;
      color: #e5d4c0;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-auto-float:hover { background: linear-gradient(180deg, #614f41 0%, #3d3027 100%); }
    .btn-auto-float.auto-on { color: #70e000; border-color: #40916c; }
    .log-msg { margin-bottom: 2px; }
    .log-msg.dmg { color: #ff6b6b; }
    .log-msg.cri { color: #ffd700; font-weight: bold; }
    .log-msg.heal { color: #51cf66; font-weight: bold; }
    .log-msg.shield { color: #ffffff; font-weight: bold; }
    .log-msg.buff { color: #a855f7; font-weight: bold; }
    .log-msg.sys { color: #fcc419; }

    /* 控制面板 (配合移除跳過按鈕後，3個按鈕平均分配) */
    .control-panel {
      display: flex;
      gap: 4px;
      padding: 2px 0;
    }

    /* ============ 戰鬥前流程：關卡選擇 / 佈陣預覽 ============ */
    .screen-panel {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 4px 2px;
      overflow: hidden;
    }

    .screen-title {
      font-size: 14px;
      color: #ffd700;
      text-align: center;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-shadow: 0 0 6px rgba(255,215,0,0.4);
      flex-shrink: 0;
    }

    /* 關卡列表 */
    .quest-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }

    .quest-pagination {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #3d2f24;
    }
    .quest-pagination .btn {
      flex: 0 0 auto;
      width: auto;
      padding: 8px 12px;
      font-size: 11px;
    }
    .quest-page-indicator {
      color: #cbb392;
      font-size: 12px;
      font-weight: bold;
    }

    .quest-card {
      background: linear-gradient(180deg, #241d18 0%, #171310 100%);
      border: 1px solid #4a382c;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .quest-card:hover { border-color: #b38f58; transform: translateY(-1px); }

    .quest-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .quest-card-hint {
      color: #ffd700;
      font-size: 14px;
      font-weight: bold;
    }
    .quest-card-level {
      color: #cbb392;
      font-size: 11px;
      background: rgba(0,0,0,0.4);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .quest-card-event {
      font-size: 10px;
      color: #ffb347;
      background: rgba(255, 179, 71, 0.1);
      border: 1px solid rgba(255, 179, 71, 0.35);
      border-radius: 4px;
      padding: 3px 6px;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .quest-enemy-row {
      display: flex;
      gap: 4px;
      justify-content: space-between;
    }
    .quest-enemy-mini {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      padding: 3px 2px;
      min-width: 0;
    }
    .quest-enemy-mini .mini-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.3);
      margin-bottom: 2px;
      position: relative;
    }
    .quest-enemy-mini .mini-name {
      font-size: 9px;
      color: #ccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .quest-enemy-mini .mini-skills {
      font-size: 8px;
      color: #8a95a5;
      text-align: center;
      line-height: 1.3;
      margin-top: 1px;
    }

    /* 佈陣畫面 */
    .formation-quest-info {
      flex-shrink: 0;
      background: linear-gradient(180deg, #241d18 0%, #171310 100%);
      border: 1px solid #4a382c;
      border-radius: 8px;
      padding: 6px 8px;
      margin-bottom: 8px;
    }
    .formation-roster {
      flex: 1 1 auto;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      align-content: flex-start;
      min-height: 0;
    }
    .roster-card {
      background: #1f1b18;
      border: 2px solid #4a3e35;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 2px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
      position: relative;
    }
    .roster-card:hover { transform: translateY(-2px); }
    .roster-card.selected {
      border-color: #ffd700;
      box-shadow: 0 0 8px #ffd700;
      background: rgba(255,215,0,0.08);
    }
    .roster-card.disabled { opacity: 0.35; cursor: not-allowed; }
    .roster-card .mini-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      border: 1px solid rgba(255,255,255,0.3);
      margin-bottom: 2px;
      position: relative;
    }
    .roster-card .mini-name {
      font-size: 9px;
      color: #e5d4c0;
      font-weight: bold;
      white-space: nowrap;
    }
    .roster-card .mini-pos {
      font-size: 7px;
      color: #8a95a5;
    }
    .roster-card .mini-tags {
      font-size: 6px;
      color: #7a8a6a;
      text-align: center;
      line-height: 1.25;
      margin-top: 1px;
      word-break: break-all;
    }
    .roster-selected-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ffd700;
      color: #000;
      font-size: 8px;
      font-weight: bold;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .formation-preview {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #3d2f24;
    }
    .preview-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-col-title {
      font-size: 9px;
      color: #ffb347;
      margin-bottom: 3px;
      font-weight: bold;
    }
    .preview-slots {
      display: flex;
      gap: 2px;
    }
    .preview-slot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border: 1px dashed #555;
      background: rgba(255,255,255,0.03);
    }
    .preview-slot.filled { border-style: solid; }

    .formation-actions {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .formation-actions .btn-restart {
      flex: 1;
      padding: 8px 0;
      font-size: 11px;
    }
    .formation-actions .btn-restart:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }
    .formation-actions .btn {
      flex: 1;
    }

    .btn-cheat-open {
      flex-shrink: 0;
      margin-top: 6px;
      padding: 6px 0;
      font-size: 10px;
      background: rgba(0,0,0,0.3);
      border: 1px dashed #6b5a45;
      border-radius: 6px;
      color: #a89a80;
      cursor: pointer;
    }
    .btn-cheat-open:hover { color: #ffd700; border-color: #ffd700; }

    .cheat-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;

    .cheat-modal-box {

    .cheat-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffd700;

    .btn {

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.auto-on { color: #70e000; border-color: #40916c; }

    /* 水晶傷害提示小視窗(分別錨定在敵我雙方的水晶血條上方) */

      letter-spacing: 1px;
      white-space: nowrap;
      pointer-events: none;
      animation: fadeIn 0.15s ease-out forwards;
    }
    .crystal-notice.notice-red { color: #ff4d4d; text-shadow: 0 0 8px #000, 0 0 6px #ff0000; }
    .crystal-notice.notice-pink { color: #ff8fd6; text-shadow: 0 0 8px #000, 0 0 6px #ff4fc3; }
    .crystal-notice.notice-white { color: #ffffff; text-shadow: 0 0 8px #000, 0 0 6px #ffffff; }

    /* 技能提示浮窗 (非全螢幕蓋板，大小與戰鬥 LOG 區域相符，附帶 X 關閉按鈕) */
    .skill-info-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(24, 21, 19, 0.95);
      border: 2px solid #b38f58;
      border-radius: 8px;
      padding: 8px 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      z-index: 150;
      flex-direction: column;
      justify-content: space-between;
      animation: fadeIn 0.2s ease-out forwards;
      overflow: hidden;
      box-sizing: border-box;
    }

    .skill-info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #4a382c;
      padding-bottom: 2px;
      min-width: 0;
    }

    .skill-info-title {
      font-size: 12px;
      font-weight: bold;
      color: #ffd700;
      flex: 1;
      min-width: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .skill-close-x {
      font-size: 12px;
      color: #aaa;
      cursor: pointer;
      padding: 0 4px;
      border-radius: 3px;

    }

    .skill-info-desc {

      overflow-x: hidden;
      max-height: 50px;
      text-align: left;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .skill-info-footer {
      display: flex;
      justify-content: flex-end;
    }

    .btn-confirm-skill {
      padding: 3px 10px;
      font-size: 9px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 100%);
      border: 1px solid #81c784;
      color: #fff;
    }

    /* 戰鬥結果蓋板 Modal */
    .result-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      z-index: 200;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.4s ease-out forwards;
    }

    .battle-start-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 250;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.2s ease-out forwards;
    }
    .battle-start-text {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 6px;
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255,215,0,0.8), 0 0 6px #000;
      border-top: 3px solid #ffd700;
      border-bottom: 3px solid #ffd700;
      padding: 14px 10px;
      animation: battleStartPop 0.5s ease-out forwards;
    }
    @keyframes battleStartPop {
      0% { transform: scale(0.6); opacity: 0; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 事件蓋板：三選一(我方加強=藍/敵方弱化=紅) */
    .event-select-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;

      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.25s ease-out forwards;
    }
    .event-select-box {
      width: 88%;
      background: rgba(20, 18, 22, 0.97);
      border: 2px solid #4a90d9;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 0 24px rgba(0,0,0,0.9);
    }
    .event-select-box.evt-enemy { border-color: #d94a4a; }
    .event-select-title {
      text-align: center;
      font-size: 16px;
      font-weight: 900;
      color: #ffd700;
      margin-bottom: 12px;
      text-shadow: 0 0 8px rgba(255,215,0,0.6);
    }
    .event-select-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .event-option-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: linear-gradient(180deg, #2a3a4a 0%, #1a232e 100%);
      border: 1px solid #4a90d9;
      border-radius: 8px;
      color: #e5d4c0;
      cursor: pointer;
      text-align: left;
    }
    .event-select-box.evt-enemy .event-option-btn { border-color: #d94a4a; background: linear-gradient(180deg, #3a2a2a 0%, #2e1a1a 100%); }
    .event-option-btn:hover { filter: brightness(1.3); }
    .event-option-icon { font-size: 22px; flex-shrink: 0; }
    .event-option-name { font-size: 13px; font-weight: bold; }
    .event-option-desc { font-size: 10px; color: #a89a80; margin-top: 2px; }

    /* 事件蓋板：場地buff/debuff短暫顯示(buff=綠/debuff=紫) */
    .event-announce-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);

      border: 2px solid #22c55e;

    }
    .event-announce-box.evt-debuff { border-color: #a855f7; }
    .event-announce-title {
      font-size: 18px;
      font-weight: 900;
      color: #7ee787;
      text-shadow: 0 0 10px rgba(126,231,135,0.7);
      letter-spacing: 2px;
    }
    .event-announce-box.evt-debuff .event-announce-title { color: #d8b4fe; text-shadow: 0 0 10px rgba(216,180,254,0.7); }

    .result-modal.win {
      border: 2px solid #ffd700;
      border-radius: 12px;
    }

    .result-modal.lose {
      border: 2px solid #ef4444;
      border-radius: 12px;
    }

    .result-title {
      font-size: 36px;
      font-weight: 900;
      margin-bottom: 12px;
      letter-spacing: 4px;
      text-shadow: 0 0 12px rgba(0,0,0,0.8);
    }

    .result-modal.win .result-title {
      color: #ffd700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    .result-modal.lose .result-title {
      color: #ef4444;
      text-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
    }

    .result-desc {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 24px;
      text-align: center;
    }

    .btn-restart {
      padding: 12px 28px;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(180deg, #d97706 0%, #b45309 100%);
      border: 1px solid #f59e0b;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(217, 119, 6, 0.5);
      transition: all 0.2s ease;
    }

    .btn-restart:hover {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .anim-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* 特效 */
    .projectile-ad {
      position: absolute; width: 40px; height: 6px;
      background: linear-gradient(90deg, #ffffff, #ffcc00);
      box-shadow: 0 0 10px #ff9900; border-radius: 3px; z-index: 101;
      transition: all calc(0.25s / var(--speed)) linear;
    }
    .projectile-ap {
      position: absolute; width: 24px; height: 24px;
      background: radial-gradient(circle, #ffffff 10%, #a855f7 60%, #3b82f6 100%);
      box-shadow: 0 0 14px #a855f7, 0 0 22px #3b82f6;
      border-radius: 50%; z-index: 101; transition: all calc(0.3s / var(--speed)) ease-in-out;
    }
    .hit-effect-ad {
      position: absolute; width: 60px; height: 60px; pointer-events: none; z-index: 102;
    }
    .hit-effect-ad::before, .hit-effect-ad::after {
      content: ''; position: absolute; background: #ff0000; box-shadow: 0 0 8px #ff4444;
    }
    .hit-effect-ad::before { top: 28px; left: 5px; width: 50px; height: 4px; transform: rotate(-35deg); }
    .hit-effect-ad::after { top: 28px; left: 5px; width: 50px; height: 4px; transform: rotate(35deg); }

    .hit-effect-ap {
      position: absolute; width: 50px; height: 50px;
      background: radial-gradient(circle, #ffffff 0%, #c084fc 50%, rgba(147,51,234,0) 100%);
      border-radius: 50%; animation: apExplode calc(0.3s / var(--speed)) ease-out forwards; pointer-events: none; z-index: 102;
    }

    @keyframes apExplode {
      0% { transform: scale(0.2); opacity: 1; }
      100% { transform: scale(2.0); opacity: 0; }
    }

    .dmg-num { position: absolute; font-size: 18px; font-weight: bold; color: #ff3333; text-shadow: 0 0 4px #000; animation: floatUp calc(0.8s / var(--speed)) ease-out forwards; z-index: 105; }
    .cri-num { position: absolute; font-size: 24px; font-weight: 900; color: #ffd700; text-shadow: 0 0 8px #ff0000; animation: floatUp calc(0.8s / var(--speed)) ease-out forwards; z-index: 106; }
    .heal-num { position: absolute; font-size: 18px; font-weight: bold; color: #2ea043; text-shadow: 0 0 4px #000; animation: floatUp calc(0.8s / var(--speed)) ease-out forwards; z-index: 105; }
    .shield-num { position: absolute; font-size: 18px; font-weight: bold; color: #ffffff; text-shadow: 0 0 6px #000; animation: floatUp calc(0.8s / var(--speed)) ease-out forwards; z-index: 105; }
    .mp-num { position: absolute; font-size: 18px; font-weight: bold; color: #38bdf8; text-shadow: 0 0 4px #000; animation: floatUp calc(0.8s / var(--speed)) ease-out forwards; z-index: 105; }
    .buff-num { position: absolute; font-size: 16px; font-weight: bold; color: #a855f7; text-shadow: 0 0 4px #000; animation: floatUp calc(0.8s / var(--speed)) ease-out forwards; z-index: 105; }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      50% { transform: translateY(-15px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-30px) scale(1); }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="anim-overlay" id="anim-overlay"></div>

    <!-- 戰鬥結果蓋板 Modal -->
    <div class="result-modal" id="result-modal">
      <div class="result-title" id="result-title">戰鬥勝利</div>
      <div class="result-desc" id="result-desc">成功擊潰敵軍召喚水晶與所有七宗罪英雄！</div>
      <button class="btn-restart" onclick="restartGame()">重新篩選隊員並戰鬥</button>
    </div>

    <!-- 戰鬥開始蓋板 -->
    <div class="battle-start-overlay" id="battle-start-overlay">
      <div class="battle-start-text">BATTLE START</div>
    </div>

    <!-- 事件蓋板(三選一：我方加強/敵方弱化) -->
    <div class="event-select-modal" id="event-select-modal">
      <div class="event-select-box" id="event-select-box">
        <div class="event-select-title" id="event-select-title">事件名稱</div>
        <div class="event-select-options" id="event-select-options"></div>
      </div>
    </div>

    <!-- 事件蓋板(場地buff/debuff，短暫顯示後自動套用) -->
    <div class="event-announce-modal" id="event-announce-modal">
      <div class="event-announce-box" id="event-announce-box">
        <div class="event-announce-title" id="event-announce-title">事件名稱</div>
      </div>
    </div>

    <!-- 畫面1：關卡選擇 -->
    <div class="screen-panel" id="screen-quest-select">
      <div class="screen-title">⚔️ 選擇關卡</div>
      <div class="quest-list" id="quest-list"></div>
      <div class="quest-pagination">
        <button class="btn" id="btn-quest-prev" onclick="questPrevPage()">◀ 上一頁</button>
        <span class="quest-page-indicator" id="quest-page-indicator">1 / 1</span>
        <button class="btn" id="btn-quest-next" onclick="questNextPage()">下一頁 ▶</button>
      </div>
    </div>

    <!-- 畫面2：佈陣與戰前預覽 -->
    <div class="screen-panel" id="screen-team-formation" style="display:none;">
      <div class="screen-title">🛡️ 佈陣選擇 (選擇5名英雄上陣)</div>
      <div class="formation-quest-info" id="formation-quest-info"></div>
      <div class="formation-roster" id="formation-roster"></div>
      <div class="formation-preview" id="formation-preview"></div>
      <div class="formation-actions">
        <button class="btn" id="btn-back-to-quest" onclick="backToQuestSelect()">返回關卡選擇</button>
        <button class="btn-restart" id="btn-start-battle" onclick="confirmFormationAndStart()" disabled>開始戰鬥 (0/5)</button>
      </div>
      <button class="btn-cheat-open" onclick="openCheatModal()">⚙ 測試工具：調整我方等級</button>
    </div>

    <!-- 作弊/測試用：調整玩家等級彈窗 -->
    <div class="cheat-modal" id="cheat-modal" style="display:none;">
      <div class="cheat-modal-box">
        <div class="cheat-modal-header">
          <span>調整玩家等級 (測試用)</span>
          <span class="skill-close-x" onclick="closeCheatModal()">✕</span>
        </div>
        <div class="cheat-modal-body">
          <input type="range" min="1" max="100" value="1" id="cheat-level-slider" oninput="onCheatLevelInput(this.value)">
          <div class="cheat-level-value">等級：<span id="cheat-level-display">1</span> / 100</div>
          <div class="cheat-modal-desc">套用後將把整隊我方英雄的等級設為所選數值(影響HP/ATK/MATK/DEF/MDEF)，僅供測試使用。</div>
          <button class="btn-confirm-skill" onclick="applyCheatLevel()">套用</button>
        </div>
      </div>
    </div>

    <!-- 畫面3：戰鬥畫面 (原本內容) -->
    <div id="screen-battle" style="display:none;">
    <!-- 敵方區域 -->
    <div>
      <div class="top-bar">
        <span>敵方召喚水晶</span>
        <span id="enemy-spd-order">陣營: 敵軍</span>
      </div>
      <div class="crystal-box">
        <div class="crystal-notice" id="crystal-notice-enemy"></div>
        <div class="bar-container">
          <div class="fill-bar crystal-hp-enemy" id="enemy-crystal-fill"></div>
          <div class="bar-text" id="enemy-crystal-text">水晶 HP: -- / --</div>
        </div>
      </div>
      <div class="crystal-art-wrap" id="enemy-crystal-art"></div>
      <div class="card-row" id="enemy-row"></div>
    </div>

    <!-- 行動順序(左側直排) + 戰場日誌 -->
    <div class="battle-grid">
      <div class="timeline-vertical-col">
        <div class="timeline-list" id="timeline-list"></div>
      </div>
      <div class="log-col">
        <div class="log-header">
          <span class="log-header-text" id="turn-info">第1回合</span>
        </div>
        <div class="log-box-wrap">
          <div class="log-box" id="log-box"></div>
          <!-- 技能資訊提示浮窗：固定疊在戰鬥LOG正上方，大小與戰鬥LOG完全一致 -->
          <div class="skill-info-modal" id="skill-info-modal">
            <div class="skill-info-header">
              <div class="skill-info-title" id="skill-modal-title">技能名稱</div>
              <div class="skill-close-x" onclick="closeSkillModal()">✕</div>
            </div>
            <div class="skill-info-desc" id="skill-modal-desc">技能說明內容文字……</div>
            <div class="skill-info-footer">
              <button class="btn-confirm-skill" onclick="closeSkillModal()">關閉提示</button>
            </div>
          </div>
        </div>
        <button class="btn-auto-float" id="btn-auto" onclick="toggleAuto()">自動戰鬥: OFF</button>
      </div>
    </div>

    <!-- 我方區域 -->
    <div>
      <div class="card-row" id="player-row"></div>
      <div class="crystal-art-wrap" id="player-crystal-art"></div>
      <div class="crystal-box">
        <div class="crystal-notice" id="crystal-notice-player"></div>
        <div class="bar-container">
          <div class="fill-bar crystal-hp-player" id="player-crystal-fill"></div>
          <div class="bar-text" id="player-crystal-text">水晶 HP: -- / --</div>
        </div>
      </div>
      <div class="top-bar">
        <span>我方召喚水晶</span>
      </div>
    </div>

    <!-- 控制按鈕 (自動戰鬥已移至戰場日誌旁) -->
    <div class="control-panel">
      <button class="btn" id="btn-atk" onclick="onSkillBtnClick('ATK')">普通攻擊</button>
      <button class="btn" id="btn-skill1" onclick="onSkillBtnClick('SKILL1')">技能1</button>
      <button class="btn" id="btn-skill2" onclick="onSkillBtnClick('SKILL2')">技能2</button>
      <button class="btn" id="btn-swap" onclick="onSwapBtnClick()">換位</button>
    </div>
    </div>
  </div>

  <script>
    // ==================================================================
    // 以下三份資料庫(BUFF / SKILL / CARD)皆由「召喚英雄.xlsx」自動產生
    // 請勿手動修改標記區間內的內容 —— 修改請直接編輯 xlsx，
    // 再以 build_game.py 重新產生本檔案即可同步所有數值設定。
    // ==================================================================

    // ##AUTO-GENERATED:BUFF_DATABASE:START##
    const BUFF_DATABASE = {
      1001: { id: 1001, name: "攻擊上升", icon: "⚔️▲", isUp: true, reflashAble: true, maxStack: 5, duration: 3, atk: 0.05 },
      1002: { id: 1002, name: "防禦上升", icon: "🛡️▲", isUp: true, reflashAble: true, maxStack: 5, duration: 3, def: 0.05 },
      1003: { id: 1003, name: "魔攻上升", icon: "🔮▲", isUp: true, reflashAble: true, maxStack: 5, duration: 3, matk: 0.05 },
