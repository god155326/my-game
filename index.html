<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>召喚英雄 - 七宗罪戰術對戰</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0d0d11;
      color: #e0e0e0;
      font-family: 'Times New Roman', serif, STHeiti, "Microsoft JhengHei";
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .game-container {
      width: 540px;
      height: 940px;
      background: #181513;
      border: 4px solid #3b2d23;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 15px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      background-image: radial-gradient(circle at 50% 50%, #2a201a 0%, #110d0b 100%);
      --speed: 1;
    }

    #screen-battle {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 頂部行動排序列 (固定顯示 5 名) */
    .timeline-vertical-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
      justify-content: center;
      width: 34px;
      flex-shrink: 0;
    }

    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }

    .timeline-item {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border: 1.5px solid #333;
      background: rgba(255,255,255,0.05);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .timeline-item.active {
      border-color: #ffd700;
      box-shadow: 0 0 8px #ffd700;
      transform: scale(1.08);
      z-index: 2;
    }

    .timeline-item.player { box-shadow: inset 0 0 0 2px #3b82f6; }
    .timeline-item.enemy { box-shadow: inset 0 0 0 2px #ef4444; }
    .timeline-item.active.player, .timeline-item.active.enemy { box-shadow: 0 0 10px #ffd700; }

    .timeline-item.dead { opacity: 0.35; filter: grayscale(100%); }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.6);
      border: 1px solid #4a382c;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #cbb392;
    }

    /* 水晶血量 */
    .crystal-box {
      background: rgba(0,0,0,0.4);
      padding: 4px;
      border-radius: 6px;
      margin: 4px 0;
      border: 1px solid #3d2f24;
      position: relative;
    }

    /* 召喚水晶圖示 */
    .crystal-art-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px 0 2px;
      background: radial-gradient(circle, rgba(60,110,140,0.18) 0%, rgba(0,0,0,0) 70%);
    }
    .crystal-art-wrap svg {
      width: 55px;
      height: 55px;
      animation: crystalFloat 3s ease-in-out infinite;
    }
    @keyframes crystalFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .bar-container {
      width: 100%;
      height: 16px;
      background: #111;
      border: 1px solid #5a4638;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin: 2px 0;
    }

    .fill-bar {
      height: 100%;
      transition: width calc(0.3s / var(--speed)) ease-out;
    }

    .crystal-hp-enemy { background: linear-gradient(90deg, #801212, #e63946); }
    .crystal-hp-player { background: linear-gradient(90deg, #1d4ed8, #3b82f6); }

    .bar-text {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }

    /* 卡牌風格 */
    .card-row {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      height: 220px;
      position: relative;
    }

    .card {
      flex: 1;
      background: #1f1b18;
      border: 1px solid #4a3e35;
      border-radius: 12px 12px 6px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .card.player { border-top: 3px solid #3b82f6; }
    .card.enemy { border-top: 3px solid #ef4444; }

    .card.active {
      border-color: #ffd700 !important;
      box-shadow: 0 0 10px #ffd700;
      transform: translateY(-4px);
    }

    .card.targetable {
      border-color: #ff4500 !important;
      animation: targetPulse 1s infinite alternate;
    }

    .card.selected {
      border-color: #22c55e !important;
      box-shadow: 0 0 10px #22c55e;
      animation: none;
      opacity: 0.75;
    }

    /* 隨機技能：預覽階段標示「可能施放對象」的候選池(藍框) */
    .card.preview-random {
      border-color: #3b82f6 !important;
      animation: previewPulse-blue 0.5s infinite alternate;
    }
    /* 全體技能：預覽階段標示「必定全部命中」的對象(紅框) */
    .card.preview-all {
      border-color: #ef4444 !important;
      animation: previewPulse-red 0.5s infinite alternate;
    }
    @keyframes previewPulse-blue {
      0% { box-shadow: 0 0 4px #3b82f6; }
      100% { box-shadow: 0 0 14px #3b82f6; }
    }
    @keyframes previewPulse-red {
      0% { box-shadow: 0 0 4px #ef4444; }
      100% { box-shadow: 0 0 14px #ef4444; }
    }

    /* 隨機/全體技能的目標蓋板：覆蓋整排候選對象，玩家點擊蓋板才會觸發實際判定 */
    .target-mask {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 8, 6, 0.68);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
      cursor: pointer;
      animation: fadeIn 0.2s ease-out forwards;
    }
    .target-mask-label {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-align: center;
      line-height: 1.3;
      padding: 0 4px;
      text-shadow: 0 0 10px #000, 0 0 6px #ffd700;
    }
    .target-mask.mask-all .target-mask-label { color: #ffb3b3; text-shadow: 0 0 10px #000, 0 0 8px #ef4444; }
    .target-mask.mask-random .target-mask-label { color: #bcd8ff; text-shadow: 0 0 10px #000, 0 0 8px #3b82f6; }

    @keyframes targetPulse {
      0% { box-shadow: 0 0 4px #ff4500; }
      100% { box-shadow: 0 0 12px #ff4500; }
    }

    .card.dead {
      filter: grayscale(100%) brightness(0.3);
      border-color: #555 !important;
    }

    /* 換位功能允許選擇死亡的隊友，需確保可選標示不被死亡樣式蓋掉 */
    .card.dead.targetable {
      border-color: #ff4500 !important;
      filter: grayscale(60%) brightness(0.6);
    }

    .hero-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border: 2px solid #5a4638;
      margin: 2px 0;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
      background-size: cover;
      position: relative;
    }

    /* 定位標示(坦/補/打)：貼在頭像左斜上方的小圓章 */
    .position-badge {
      position: absolute;
      top: -5px;
      left: -5px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #17130f;
      border: 1px solid rgba(255,255,255,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      line-height: 1;
      z-index: 4;
      box-shadow: 0 0 3px rgba(0,0,0,0.8);
    }
    .position-badge.badge-sm {
      width: 12px;
      height: 12px;
      font-size: 7px;
      top: -3px;
      left: -3px;
    }

    .revive-tag {
      position: absolute;
      top: 35%;
      background: rgba(180, 0, 0, 0.85);
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px solid #ff4444;
      text-align: center;
      z-index: 5;
    }


    .card-name {
      font-size: 11px;
      color: #e5d4c0;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* BUFF 容器 */
    .buff-container {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      justify-content: center;
      width: 100%;
      min-height: 18px;
      margin: 2px 0;
    }

    .buff-icon {
      font-size: 9px;
      font-weight: bold;
      padding: 1px 3px;
      border-radius: 3px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 0 3px rgba(0,0,0,0.5);
    }
    .buff-up { background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 100%); border-color: #81c784; }
    .buff-down { background: linear-gradient(180deg, #c62828 0%, #8e0000 100%); border-color: #e57373; }

    /* HP & MP 條 */
    .unit-status-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mini-bar {
      width: 100%;
      height: 12px;
      background: #000;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      border: 1px solid #444;
    }
    .mini-fill-hp { background: #dc2626; height: 100%; float: left; }
    .mini-fill-shield { background: #ffffff; height: 100%; float: left; opacity: 0.9; }
    .mini-fill-mp { background: #2563eb; height: 100%; }
    .mini-bar-agi {
      height: 5px;
      border-width: 1px;
    }
    .mini-fill-agi {
      background: linear-gradient(90deg, #f59e0b, #ffd700);
      height: 100%;
      transition: width calc(0.3s / var(--speed)) ease-out;
    }
    .mini-text {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      font-size: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      text-shadow: 1px 1px 1px #000;
    }

    /* 戰場日誌 */
    .battle-grid {
      flex: 1;
      background: radial-gradient(circle, rgba(40,32,26,0.6) 0%, rgba(15,12,10,0.9) 100%);
      border: 1px solid #3b2d23;
      margin: 6px 0;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      gap: 8px;
      padding: 8px;
    }

    .log-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      min-height: 0;
    }

    .log-header {
      display: flex;
      justify-content: flex-end;
      padding: 0 2px;
      flex-shrink: 0;
    }

    .log-header-text {
      color: #ffb347;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 0 4px #000;
    }

    .log-box {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      background: rgba(0,0,0,0.75);
      border: 1px solid #4a3e35;
      border-radius: 6px;
      padding: 6px;
      overflow-y: auto;
      font-size: 11px;
      color: #bfa88e;
      z-index: 2;
    }

    /* 移至戰場日誌下方的自動戰鬥按鈕 */
    .btn-auto-float {
      align-self: flex-end;
      flex-shrink: 0;
      width: 40%;
      min-width: 62px;
      padding: 8px 2px;
      font-size: 9px;
      line-height: 1.3;
      text-align: center;
      background: linear-gradient(180deg, #4a3c31 0%, #292019 100%);
      border: 1px solid #7a6350;
      border-radius: 6px;
      color: #e5d4c0;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-auto-float:hover { background: linear-gradient(180deg, #614f41 0%, #3d3027 100%); }
    .btn-auto-float.auto-on { color: #70e000; border-color: #40916c; }
    .log-msg { margin-bottom: 2px; }
    .log-msg.dmg { color: #ff6b6b; }
    .log-msg.cri { color: #ffd700; font-weight: bold; }
    .log-msg.heal { color: #51cf66; font-weight: bold; }
    .log-msg.shield { color: #ffffff; font-weight: bold; }
    .log-msg.buff { color: #a855f7; font-weight: bold; }
    .log-msg.sys { color: #fcc419; }

    /* 控制面板 (配合移除跳過按鈕後，3個按鈕平均分配) */
    .control-panel {
      display: flex;
      gap: 4px;
      padding: 2px 0;
    }

    /* ============ 戰鬥前流程：關卡選擇 / 佈陣預覽 ============ */
    .screen-panel {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 4px 2px;
      overflow: hidden;
    }

    .screen-title {
      font-size: 14px;
      color: #ffd700;
      text-align: center;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-shadow: 0 0 6px rgba(255,215,0,0.4);
      flex-shrink: 0;
    }

    /* 關卡列表 */
    .quest-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }

    .quest-pagination {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #3d2f24;
    }
    .quest-pagination .btn {
      flex: 0 0 auto;
      width: auto;
      padding: 8px 12px;
      font-size: 11px;
    }
    .quest-page-indicator {
      color: #cbb392;
      font-size: 12px;
      font-weight: bold;
    }

    .quest-card {
      background: linear-gradient(180deg, #241d18 0%, #171310 100%);
      border: 1px solid #4a382c;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .quest-card:hover { border-color: #b38f58; transform: translateY(-1px); }

    .quest-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .quest-card-hint {
      color: #ffd700;
      font-size: 14px;
      font-weight: bold;
    }
    .quest-card-level {
      color: #cbb392;
      font-size: 11px;
      background: rgba(0,0,0,0.4);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .quest-enemy-row {
      display: flex;
      gap: 4px;
      justify-content: space-between;
    }
    .quest-enemy-mini {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      padding: 3px 2px;
      min-width: 0;
    }
    .quest-enemy-mini .mini-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.3);
      margin-bottom: 2px;
      position: relative;
    }
    .quest-enemy-mini .mini-name {
      font-size: 9px;
      color: #ccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .quest-enemy-mini .mini-skills {
      font-size: 8px;
      color: #8a95a5;
      text-align: center;
      line-height: 1.3;
      margin-top: 1px;
    }

    /* 佈陣畫面 */
    .formation-quest-info {
      flex-shrink: 0;
      background: linear-gradient(180deg, #241d18 0%, #171310 100%);
      border: 1px solid #4a382c;
      border-radius: 8px;
      padding: 6px 8px;
      margin-bottom: 8px;
    }
    .formation-roster {
      flex: 1 1 auto;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      align-content: flex-start;
      min-height: 0;
    }
    .roster-card {
      background: #1f1b18;
      border: 2px solid #4a3e35;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 2px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
      position: relative;
    }
    .roster-card:hover { transform: translateY(-2px); }
    .roster-card.selected {
      border-color: #ffd700;
      box-shadow: 0 0 8px #ffd700;
      background: rgba(255,215,0,0.08);
    }
    .roster-card.disabled { opacity: 0.35; cursor: not-allowed; }
    .roster-card .mini-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      border: 1px solid rgba(255,255,255,0.3);
      margin-bottom: 2px;
      position: relative;
    }
    .roster-card .mini-name {
      font-size: 9px;
      color: #e5d4c0;
      font-weight: bold;
      white-space: nowrap;
    }
    .roster-card .mini-pos {
      font-size: 7px;
      color: #8a95a5;
    }
    .roster-card .mini-tags {
      font-size: 6px;
      color: #7a8a6a;
      text-align: center;
      line-height: 1.25;
      margin-top: 1px;
      word-break: break-all;
    }
    .roster-selected-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ffd700;
      color: #000;
      font-size: 8px;
      font-weight: bold;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .formation-preview {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #3d2f24;
    }
    .preview-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-col-title {
      font-size: 9px;
      color: #ffb347;
      margin-bottom: 3px;
      font-weight: bold;
    }
    .preview-slots {
      display: flex;
      gap: 2px;
    }
    .preview-slot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border: 1px dashed #555;
      background: rgba(255,255,255,0.03);
    }
    .preview-slot.filled { border-style: solid; }

    .formation-actions {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .formation-actions .btn-restart {
      flex: 1;
      padding: 8px 0;
      font-size: 11px;
    }
    .formation-actions .btn-restart:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }
    .formation-actions .btn {
      flex: 1;
    }

    .btn-cheat-open {
      flex-shrink: 0;
      margin-top: 6px;
      padding: 6px 0;
      font-size: 10px;
      background: rgba(0,0,0,0.3);
      border: 1px dashed #6b5a45;
      border-radius: 6px;
      color: #a89a80;
      cursor: pointer;
    }
    .btn-cheat-open:hover { color: #ffd700; border-color: #ffd700; }

    .cheat-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      z-index: 180;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cheat-modal-box {
      width: 84%;
      background: rgba(24, 21, 19, 0.98);
      border: 2px solid #b38f58;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.9);
    }
    .cheat-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffd700;
      font-size: 13px;
      font-weight: bold;
      border-bottom: 1px solid #4a382c;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }
    .cheat-modal-body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    .cheat-modal-body input[type="range"] {
      width: 100%;
    }

      font-size: 14px;
      font-weight: bold;
    }
    .cheat-modal-desc {
      font-size: 10px;
      color: #a89a80;
      line-height: 1.4;
      text-align: center;

    .btn {
      flex: 1;
      padding: 8px 0;

      border: 1px solid #7a6350;

      color: #e5d4c0;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;

    /* 水晶傷害提示小視窗(分別錨定在敵我雙方的水晶血條上方) */

      display: none;
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-bottom: 4px;
      z-index: 170;
      padding: 4px 12px;
      border-radius: 6px;
      background: rgba(15, 11, 9, 0.94);
      border: 2px solid currentColor;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 1px;
      white-space: nowrap;
      pointer-events: none;
      animation: fadeIn 0.15s ease-out forwards;
    }
    .crystal-notice.notice-red { color: #ff4d4d; text-shadow: 0 0 8px #000, 0 0 6px #ff0000; }
    .crystal-notice.notice-pink { color: #ff8fd6; text-shadow: 0 0 8px #000, 0 0 6px #ff4fc3; }
    .crystal-notice.notice-white { color: #ffffff; text-shadow: 0 0 8px #000, 0 0 6px #ffffff; }

    /* 技能提示浮窗 (非全螢幕蓋板，大小與戰鬥 LOG 區域相符，附帶 X 關閉按鈕) */

      display: none;
      position: absolute;

      left: 50%;

    .skill-info-header {

      align-items: center;
      border-bottom: 1px solid #4a382c;
      padding-bottom: 2px;
    }

    .skill-info-title {
      font-size: 12px;
      font-weight: bold;
      color: #ffd700;
    }

    .skill-close-x {
      font-size: 12px;
      color: #aaa;
      cursor: pointer;
      padding: 0 4px;
      border-radius: 3px;
      background: rgba(255,255,255,0.05);
    }
    .skill-close-x:hover {
      background: #c62828;
      color: #fff;
    }

    .skill-info-desc {
      font-size: 10px;
      color: #d1c7bd;
      line-height: 1.3;
      overflow-y: auto;
      max-height: 50px;
      text-align: left;

    .skill-info-footer {
      display: flex;
      justify-content: flex-end;

    .btn-confirm-skill {
      padding: 3px 10px;
      font-size: 9px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 100%);
      border: 1px solid #81c784;
      color: #fff;

    /* 戰鬥結果蓋板 Modal */
    .result-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;

      justify-content: center;
      align-items: center;

    }

    .result-modal.win {

      border-radius: 12px;
    }

      border: 2px solid #ef4444;

    }

    .result-title {

      font-weight: 900;

      letter-spacing: 4px;

      text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);

    .btn-restart:hover {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .anim-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* 特效 */
    .projectile-ad {
      position: absolute; width: 40px; height: 6px;
      background: linear-gradient(90deg, #ffffff, #ffcc00);
      box-shadow: 0 0 10px #ff9900; border-radius: 3px; z-index: 101;
      transition: all calc(0.25s / var(--speed)) linear;
    }
    .projectile-ap {
      position: absolute; width: 24px; height: 24px;
      background: radial-gradient(circle, #ffffff 10%, #a855f7 60%, #3b82f6 100%);
      box-shadow: 0 0 14px #a855f7, 0 0 22px #3b82f6;
      border-radius: 50%; z-index: 101; transition: all calc(0.3s / var(--speed)) ease-in-out;
    }
    .hit-effect-ad {
      position: absolute; width: 60px; height: 60px; pointer-events: none; z-index: 102;
    }
    .hit-effect-ad::before, .hit-effect-ad::after {
      content: ''; position: absolute; background: #ff0000; box-shadow: 0 0 8px #ff4444;
    }
    .hit-effect-ad::before { top: 28px; left: 5px; width: 50px; height: 4px; transform: rotate(-35deg); }
    .hit-effect-ad::after { top: 28px; left: 5px; width: 50px; height: 4px; transform: rotate(35deg); }

    .hit-effect-ap {
      position: absolute; width: 50px; height: 50px;
      background: radial-gradient(circle, #ffffff 0%, #c084fc 50%, rgba(147,51,234,0) 100%);
      border-radius: 50%; animation: apExplode calc(0.3s / var(--speed)) ease-out forwards; pointer-events: none; z-index: 102;
    }

    @keyframes apExplode {
      0% { transform: scale(0.2); opacity: 1; }
      100% { transform: scale(2.0); opacity: 0; }
    }

    .dmg-num { position: absolute; font-size: 18px; font-weight: bold; color: #ff3333; text-shadow: 0 0 4px #000; animation: floatUp calc(0.8s / var(--speed)) ease-out forwards; z-index: 105; }
    .cri-num { position: absolute; font-size: 24px; font-weight: 900; color: #ffd700; text-shadow: 0 0 8px #ff0000; animation: floatUp calc(0.8s / var(--speed)) ease-out forwards; z-index: 106; }
    .heal-num { position: absolute; font-size: 18px; font-weight: bold; color: #2ea043; text-shadow: 0 0 4px #000; animation: floatUp calc(0.8s / var(--speed)) ease-out forwards; z-index: 105; }
    .shield-num { position: absolute; font-size: 18px; font-weight: bold; color: #ffffff; text-shadow: 0 0 6px #000; animation: floatUp calc(0.8s / var(--speed)) ease-out forwards; z-index: 105; }
    .mp-num { position: absolute; font-size: 18px; font-weight: bold; color: #38bdf8; text-shadow: 0 0 4px #000; animation: floatUp calc(0.8s / var(--speed)) ease-out forwards; z-index: 105; }
    .buff-num { position: absolute; font-size: 16px; font-weight: bold; color: #a855f7; text-shadow: 0 0 4px #000; animation: floatUp calc(0.8s / var(--speed)) ease-out forwards; z-index: 105; }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      50% { transform: translateY(-15px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-30px) scale(1); }
    }
  </style>
</head>
<body>

  <div class="game-container">

          <button class="btn-confirm-skill" onclick="applyCheatLevel()">套用</button>
        </div>
      </div>
    </div>

    <!-- 畫面3：戰鬥畫面 (原本內容) -->
    <div id="screen-battle" style="display:none;">
    <!-- 敵方區域 -->

      let shuffled = [...CARD_DATABASE].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count).map((card) => ({
        ...card,
        maxHp: card.hp,

    // 依照指定的 card id 陣列組建隊伍(用於關卡固定敵方陣容、玩家自選佈陣)
    // 等級縮放公式：HP/ATK/MATK/DEF/MDEF/MP 每級成長3%，AGI 每級成長1%
    //   數值 = 起始數值 * (1 + level * 0.03)　(AGI = 起始AGI * (1 + level * 0.01))
    //   level = 0 時等同未縮放(維持原始數值)
    const LEVEL_GROWTH_MAIN = 0.03;
    const LEVEL_GROWTH_AGI = 0.01;
    function applyLevelScaling(card, level) {
      if (!level) return card;
      let mainMult = 1 + level * LEVEL_GROWTH_MAIN;
      let agiMult = 1 + level * LEVEL_GROWTH_AGI;
      return {
        ...card,
        hp: Math.round(card.hp * mainMult),
        atk: Math.round(card.atk * mainMult),
        matk: Math.round(card.matk * mainMult),
        def: Math.round(card.def * mainMult),
        mdef: Math.round(card.mdef * mainMult),
        mp: Math.round(card.mp * mainMult),
        agi: Math.round(card.agi * agiMult),
      };
    }

    function getHeroesByIds(ids, level) {
      return ids.map(id => {
        let card = CARD_DATABASE.find(c => c.id === id) || CARD_DATABASE[0];
        card = applyLevelScaling(card, level || 0);
        return {
          ...card,
          maxHp: card.hp,
          currentHp: card.hp,
          shield: 0,
          maxMp: card.mp,
          currentMp: card.mp,
          isDead: false,
          reviveCd: 0,
          buffs: [],
          agiGauge: 0,
          actedThisRound: false
        };
      });
    }

    const QUESTS_PER_PAGE = 5;

    function renderQuestList() {
      const list = document.getElementById('quest-list');
      list.innerHTML = '';

      const totalPages = Math.max(1, Math.ceil(QUEST_DATABASE.length / QUESTS_PER_PAGE));
      if (gameState.questPage >= totalPages) gameState.questPage = totalPages - 1;
      if (gameState.questPage < 0) gameState.questPage = 0;

      const startIdx = gameState.questPage * QUESTS_PER_PAGE;
      const pageQuests = QUEST_DATABASE.slice(startIdx, startIdx + QUESTS_PER_PAGE);

      pageQuests.forEach(quest => {
        const card = document.createElement('div');
        card.className = 'quest-card';
        card.onclick = () => selectQuest(quest.mapId);

        let enemyHtml = quest.enemyIds.map(id => {
          let c = CARD_DATABASE.find(x => x.id === id);
          if (!c) return '';
          let skillNames = [c.s0, c.s1, c.s2]
            .map(sid => SKILL_DATABASE[sid] ? SKILL_DATABASE[sid].name : '')
            .filter(Boolean)
            .join(' / ');
