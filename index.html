          let id = ids[i];
          let c = id ? CARD_DATABASE.find(x => x.id === id) : null;
          if (c) {
            html += `<div class="preview-slot filled" style="background-color:${c.iconBg}" title="${elName(c)}">${c.icon}</div>`;
          } else {
            html += `<div class="preview-slot">?</div>`;
          }
        }
        return html;
      }

      preview.innerHTML = `
        <div class="preview-col">
          <div class="preview-col-title">已選擇的我方隊伍</div>
          <div class="preview-slots">${slotsHtml(gameState.selectedRoster)}</div>
        </div>
      `;
    }

    function confirmFormationAndStart() {
      if (gameState.selectedRoster.length !== 5) return;
      showScreen('battle');
      initGame([...gameState.selectedRoster], [...gameState.selectedQuest.enemyIds], gameState.selectedQuest.level);
    }

    function initGame(playerIds, enemyIds, enemyLevel) {
      document.getElementById('result-modal').style.display = 'none';

      let playerHeroes = (playerIds && playerIds.length === 5) ? getHeroesByIds(playerIds, gameState.playerLevel) : getRandomHeroes(5);
      let enemyHeroes = (enemyIds && enemyIds.length === 5) ? getHeroesByIds(enemyIds, enemyLevel || 0) : getRandomHeroes(5);

      gameState.playerTeam = playerHeroes.map((h, i) => ({ ...h, id: `p_${i}`, posIdx: i, side: 'player' }));
      gameState.enemyTeam = enemyHeroes.map((h, i) => ({ ...h, id: `e_${i}`, posIdx: i, side: 'enemy' }));

      // S_HP暫時整個規格除以5：改成目前所有角色的平均血量(而非5人HP總和)
      let pMax = Math.round(gameState.playerTeam.reduce((sum, u) => sum + u.maxHp, 0) / 5);
      let eMax = Math.round(gameState.enemyTeam.reduce((sum, u) => sum + u.maxHp, 0) / 5);
      gameState.playerCrystal = { hp: pMax, maxHp: pMax };
      gameState.enemyCrystal = { hp: eMax, maxHp: eMax };

      gameState.turnCount = 1;
      document.getElementById('turn-info').innerText = `第1回合`;
      document.getElementById('log-box').innerHTML = '';

      renderBoard();
      log("戰鬥開始！", "sys");
      advanceToNextActor();
    }

    function restartGame() {
      document.getElementById('result-modal').style.display = 'none';
      gameState.selectedQuest = null;
      gameState.selectedRoster = [];
      showScreen('quest-select');
    }

    function showResultModal(isWin) {
      const modal = document.getElementById('result-modal');
      const title = document.getElementById('result-title');
      const desc = document.getElementById('result-desc');

      if (isWin) {
        modal.className = 'result-modal win';
        title.innerText = '⚔️ 戰鬥勝利';
        desc.innerText = '成功擊潰敵軍召喚水晶與所有七宗罪英雄！';
      } else {
        modal.className = 'result-modal lose';
        title.innerText = '💀 戰鬥失敗';
        desc.innerText = '我方隊伍全滅或召喚水晶遭到摧毀……';
      }

      modal.style.display = 'flex';
    }

    // 召喚水晶圖示：依HP百分比呈現不同損壞程度(健康/裂痕/瀕臨破碎)
    function crystalSvgMarkup(side, hpPercent) {
      let gradId = side === 'enemy' ? 'crystalGrad' : 'crystalGradBlue2';
      let glowId = side === 'enemy' ? 'crystalGlow' : 'crystalGlow2';
      let stops = side === 'enemy'
        ? ['#eafcff', '#7dd8f0', '#2b7fb8']
        : ['#eaf2ff', '#8fb4f0', '#2b52b8'];

      let tier = hpPercent > 50 ? 'healthy' : (hpPercent > 15 ? 'cracked' : 'critical');

      let crackOverlay = '';
      let tintOverlay = '';
      let fillOpacity = 0.95;

      if (tier === 'cracked') {
        crackOverlay = `
          <path d="M50,10 L46,28 L54,36 L44,54 L52,68" stroke="#241a12" stroke-width="1.3" fill="none" opacity="0.8"/>
          <path d="M30,32 L40,40 L34,50" stroke="#241a12" stroke-width="1" fill="none" opacity="0.65"/>
        `;
      } else if (tier === 'critical') {
        fillOpacity = 0.8;
        crackOverlay = `
          <path d="M50,8 L44,26 L54,34 L40,50 L50,62 L38,80 L48,90" stroke="#1a0505" stroke-width="1.5" fill="none" opacity="0.95"/>
          <path d="M28,30 L40,38 L30,48 L42,58" stroke="#1a0505" stroke-width="1.2" fill="none" opacity="0.9"/>
          <path d="M66,32 L58,42 L68,52 L58,64" stroke="#1a0505" stroke-width="1.2" fill="none" opacity="0.9"/>
          <polygon points="60,55 66,60 62,66" fill="#000000" opacity="0.45"/>
          <polygon points="34,60 30,66 37,68" fill="#000000" opacity="0.4"/>
        `;
        tintOverlay = `<rect x="10" y="4" width="80" height="92" fill="#7a0000" opacity="0.15"/>`;
      }

      return `
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="${stops[0]}"/>
              <stop offset="45%" stop-color="${stops[1]}"/>
              <stop offset="100%" stop-color="${stops[2]}"/>
            </linearGradient>
            <filter id="${glowId}" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="2.5" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <g filter="url(#${glowId})">
            <polygon points="50,6 74,28 68,55 60,92 40,92 32,55 26,28" fill="url(#${gradId})" stroke="#ffffff" stroke-width="1.5" opacity="${fillOpacity}"/>
            <polygon points="50,6 60,92 50,96 40,92" fill="#ffffff" opacity="0.18"/>
            <polygon points="26,28 50,6 32,55" fill="#ffffff" opacity="0.12"/>
            <line x1="50" y1="6" x2="50" y2="92" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
            <line x1="26" y1="28" x2="74" y2="28" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
            <circle cx="38" cy="20" r="2" fill="#ffffff" opacity="0.8"/>
            <circle cx="62" cy="40" r="1.4" fill="#ffffff" opacity="0.7"/>
            ${crackOverlay}
          </g>
          ${tintOverlay}
        </svg>
      `;
    }

    function renderCrystalArt(side, hp, maxHp) {
      let wrap = document.getElementById(`${side}-crystal-art`);
      if (!wrap) return;
      let pct = maxHp > 0 ? (hp / maxHp) * 100 : 100;
      wrap.innerHTML = crystalSvgMarkup(side, pct);
    }

    function updateCrystalsUI() {
      let p = gameState.playerCrystal;
      let e = gameState.enemyCrystal;

      document.getElementById('player-crystal-text').innerText = `水晶 HP: ${p.hp} / ${p.maxHp}`;
      document.getElementById('player-crystal-fill').style.width = `${Math.max(0, (p.hp / p.maxHp) * 100)}%`;

      document.getElementById('enemy-crystal-text').innerText = `水晶 HP: ${e.hp} / ${e.maxHp}`;
      document.getElementById('enemy-crystal-fill').style.width = `${Math.max(0, (e.hp / e.maxHp) * 100)}%`;

      renderCrystalArt('player', p.hp, p.maxHp);
      renderCrystalArt('enemy', e.hp, e.maxHp);
    }

    function renderBoard() {
      renderRow('player-row', gameState.playerTeam);
      renderRow('enemy-row', gameState.enemyTeam);
      updateCrystalsUI();
      renderTimeline();
    }

    // 模擬接下來 count 位會行動的角色(不影響實際遊戲狀態)，用於行動順序預覽列
    function simulateNextActors(count) {
      let allUnits = [...gameState.playerTeam, ...gameState.enemyTeam].filter(u => !u.isDead);
      if (allUnits.length === 0) return [];
      let sim = allUnits.map(u => ({ ref: u, gauge: u.agiGauge, agi: u.agi }));
      let result = [];

      for (let i = 0; i < count; i++) {
        let safety = 0;
        while (true) {
          let ready = sim.filter(s => s.gauge >= 50);
          if (ready.length > 0) {
            ready.sort((a, b) => b.gauge - a.gauge || b.agi - a.agi);
            let winner = ready[0];
            result.push(winner.ref);
            winner.gauge = Math.max(0, winner.gauge - 50);
            break;
          }
          sim.forEach(s => s.gauge += s.agi);
          safety++;
          if (safety > 100000) break;
        }
      }
      return result;
    }

    function renderTimeline() {
      const timelineList = document.getElementById('timeline-list');
      timelineList.innerHTML = '';

      let upcoming = simulateNextActors(5);

      upcoming.forEach((unit, i) => {
        const item = document.createElement('div');
        item.className = `timeline-item ${unit.side} ${i === 0 ? 'active' : ''}`;
        item.title = elName(unit);
        item.style.backgroundColor = unit.iconBg;
        item.innerText = unit.icon;
        timelineList.appendChild(item);
      });
    }

    // 定位標示(坦=盾牌/補=綠色藥草/打=劍與仗交叉)：依 card 資料的「定位」欄位產生對應圖示
    function positionBadgeIcon(position) {
      if (position === '坦') return '🛡️';
      if (position === '補') return '🌿';
      if (position === '打') return '⚔️';
      return '';
    }
    function positionBadgeHtml(position, extraClass) {
      let icon = positionBadgeIcon(position);
      if (!icon) return '';
      return `<div class="position-badge ${extraClass || ''}" title="${position}">${icon}</div>`;
    }

    function renderRow(containerId, team) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      // 依 posIdx 排序後才渲染，確保視覺上的位置與換位後的實際位置(posIdx，同時也是正前方對位判定依據)一致
      const sortedTeam = [...team].sort((a, b) => a.posIdx - b.posIdx);

      sortedTeam.forEach(unit => {
        const card = document.createElement('div');
        card.id = `card-${unit.id}`;
        card.className = `card ${unit.side} ${unit.isDead ? 'dead' : ''}`;
        card.onclick = () => handleCardClick(unit);

        let hpPercent = Math.max(0, (unit.currentHp / unit.maxHp) * 100);
        let shieldPercent = Math.min(100 - hpPercent, (unit.shield / unit.maxHp) * 100);
        let mpPercent = Math.max(0, (unit.currentMp / unit.maxMp) * 100);
        let agiPercent = Math.max(0, Math.min(100, (unit.agiGauge / 50) * 100));

        let shieldText = unit.shield > 0 ? ` (+${unit.shield})` : '';

        let buffHtml = '';
        if (unit.buffs && unit.buffs.length > 0) {
          buffHtml = unit.buffs.map(b => {
            let info = BUFF_DATABASE[b.buffId];
            if (!info) return '';
            let styleClass = info.isUp ? 'buff-up' : 'buff-down';
            return `<div class="buff-icon ${styleClass}" title="${info.name}">${info.icon}${b.stack > 1 ? b.stack : ''}</div>`;
          }).join('');
        }

        card.innerHTML = `
          <div class="hero-avatar" style="background-color: ${unit.iconBg}">${unit.icon}${positionBadgeHtml(unit.position)}</div>
          <div class="card-name">${elNameHtml(unit, 4)}</div>
          <div class="buff-container">${buffHtml}</div>
          ${unit.isDead ? `<div class="revive-tag">復活倒數<br>${unit.reviveCd} 回合</div>` : ''}
          <div class="unit-status-box">
            <div class="mini-bar">
              <div class="mini-fill-hp" style="width: ${hpPercent}%"></div>
              <div class="mini-fill-shield" style="width: ${shieldPercent}%"></div>
              <div class="mini-text">HP:${unit.currentHp}${shieldText}</div>
            </div>
            <div class="mini-bar">
              <div class="mini-fill-mp" style="width: ${mpPercent}%"></div>
              <div class="mini-text">MP:${unit.currentMp}</div>
            </div>
            <div class="mini-bar mini-bar-agi">
              <div class="mini-fill-agi" style="width: ${agiPercent}%"></div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // ============ ATB 行動條系統 ============
    // 每位角色的 AGI 條上限為 50，戰鬥開始從 0 累計；每次「跳」，場上所有存活角色一起累加一次自身 CARD 表的 AGI 數值，
    // 若跳完一輪仍沒有人達到 50，就再跳一次(全體一起累加)，直到有人達到/超過 50 為止，該角色即可行動。
    // 行動後扣除 50(保留溢出量，不整個歸零)，讓 AGI 較高的角色能提前累積下一次行動。
    // 一回合 = 場上所有角色都至少行動過一次(所以 AGI 高的角色可能在一回合內行動多次)。
    // 死亡時 AGI 條歸零，復活後重新從 0 累計。
    function tickAgiGaugesUntilReady(units) {
      let safety = 0;
      while (true) {
        let ready = units.filter(u => u.agiGauge >= 50);
        if (ready.length > 0) {
          ready.sort((a, b) => b.agiGauge - a.agiGauge || b.agi - a.agi);
          return ready[0];
        }
        units.forEach(u => u.agiGauge += u.agi);
        safety++;
        if (safety > 100000) return units[0]; // 安全保底，理論上不會觸發(agi恆為正數必定會累積到50)
      }
    }

    function advanceToNextActor() {
      if (checkGameOver()) return;

      let allUnits = [...gameState.playerTeam, ...gameState.enemyTeam];
      let aliveUnits = allUnits.filter(u => !u.isDead);
      if (aliveUnits.length === 0) return; // checkGameOver 應該已經處理，這裡僅作保底

      let activeUnit = tickAgiGaugesUntilReady(aliveUnits);
      gameState.turnQueue = [activeUnit];
      gameState.currentTurnIdx = 0;
      startActorTurn(activeUnit);
    }

    function startActorTurn(activeUnit) {
      renderTimeline();

      activeUnit.currentMp = Math.min(activeUnit.maxMp, activeUnit.currentMp + Math.floor(activeUnit.maxMp * 0.10));
      renderBoard();

      document.querySelectorAll('.card').forEach(c => c.classList.remove('active', 'targetable', 'selected', 'preview-random', 'preview-all'));
      removeTargetMask();
      const activeCard = document.getElementById(`card-${activeUnit.id}`);
      if (activeCard) activeCard.classList.add('active');

      if (gameState.isAuto || activeUnit.side === 'enemy') {
        setButtonsDisabled(true);
        setTimeout(() => autoExecuteTurn(activeUnit), td(500));
      } else {
        updateActionButtons(activeUnit);
      }
    }

    // 行動結束後呼叫：扣除本次行動消耗的AGI(保留溢出量)，並判斷是否所有存活角色都已在本回合行動過一次
    function finishActorTurn(unit) {
      unit.agiGauge = Math.max(0, unit.agiGauge - 50);
      unit.actedThisRound = true;

      let allUnits = [...gameState.playerTeam, ...gameState.enemyTeam];
      let aliveUnits = allUnits.filter(u => !u.isDead);
      let allActed = aliveUnits.length > 0 && aliveUnits.every(u => u.actedThisRound);

      if (allActed) {
        gameState.turnCount++;
        document.getElementById('turn-info').innerText = `第${gameState.turnCount}回合`;
        aliveUnits.forEach(u => u.actedThisRound = false);

        // 回合結束才處理 buff 持續回合數倒數與復活倒數(維持「以回合為單位」的原始設計)
        allUnits.forEach(u => {
          if (!u.isDead && u.buffs) {
            u.buffs.forEach(b => b.duration--);
            let expiredShield = u.buffs.some(b => b.buffId === 1999 && b.duration <= 0);
            u.buffs = u.buffs.filter(b => b.duration > 0);
            if (expiredShield) u.shield = 0; // buff 1999(護盾)消失時，護盾值也一併歸零
          }
          if (u.isDead) {
            u.reviveCd--;
            if (u.reviveCd <= 0) {
              processRevive(u);
            }
          }
        });
        renderBoard();
      }
    }

    function processRevive(unit) {
      let crystal = unit.side === 'player' ? gameState.playerCrystal : gameState.enemyCrystal;

      if (crystal.hp <= 1) {
        log(`⚠️ ${elName(unit)} 重生失敗！召喚水晶 HP 已達極限。`, 'sys');
        return;
      }

      unit.isDead = false;
      unit.currentHp = unit.maxHp;
      unit.shield = 0;
      unit.currentMp = unit.maxMp;
      unit.buffs = [];
      unit.agiGauge = 0; // 復活後AGI條重新從0開始累計
      unit.actedThisRound = false;
      log(`✨ ${elName(unit)} 已滿足重生條件自動復活！(重生 HP: ${unit.maxHp})`, 'sys');
    }

    function updateActionButtons(unit) {
      let s0 = SKILL_DATABASE[unit.s0];
      let s1 = SKILL_DATABASE[unit.s1];
      let s2 = SKILL_DATABASE[unit.s2];

      document.getElementById('btn-atk').disabled = false;
      document.getElementById('btn-skill1').disabled = unit.currentMp < s1.cost;
      document.getElementById('btn-skill2').disabled = unit.currentMp < s2.cost;

      document.getElementById('btn-atk').innerText = `${s0.name}`;
      document.getElementById('btn-skill1').innerText = `${s1.name} (${s1.cost}MP)`;
      document.getElementById('btn-skill2').innerText = `${s2.name} (${s2.cost}MP)`;

      let myTeam = unit.side === 'player' ? gameState.playerTeam : gameState.enemyTeam;
      let hasSwapTarget = myTeam.some(u => u.id !== unit.id);
      document.getElementById('btn-swap').disabled = !hasSwapTarget;
    }

    function setButtonsDisabled(disabled) {
      document.getElementById('btn-atk').disabled = disabled;
      document.getElementById('btn-skill1').disabled = disabled;
      document.getElementById('btn-skill2').disabled = disabled;
      document.getElementById('btn-swap').disabled = disabled;
    }

    // 解析 SKILL_DATABASE.target 欄位 "前排強制,對象數量,是否隨機"
    function parseTargetSpec(skillObj) {
      let parts = (skillObj.target || "0,0,0,0").split(',').map(Number);
      return { forceFront: parts[0] === 1, count: parts[1] || 0, isRandom: parts[2] === 1, isSelf: parts[3] === 1 };
    }

    // 點選技能時顯示提示浮窗(僅供玩家參考用途)，並立即依照原本設計的規則進行目標判定/選擇
    // 將技能說明內的 <AD> / <AP> 佔位符代換成實際百分比數值(數值來源=xlsx的 AD/AP 技能係數欄位)
    function formatSkillDesc(skillObj) {
      let desc = skillObj.desc || "";
      if (typeof skillObj.ad === 'number') desc = desc.split('<AD>').join(`${Math.round(skillObj.ad * 100)}%`);
      if (typeof skillObj.ap === 'number') desc = desc.split('<AP>').join(`${Math.round(skillObj.ap * 100)}%`);
      return desc;
    }

    // 水晶傷害提示小視窗：直接傷害水晶(紅字)/傷害溢出至水晶(粉紅字)共用同一套機制，分別錨定在敵我雙方水晶上
    function showCrystalNotice(text, colorClass, side) {
      const el = document.getElementById(side === 'enemy' ? 'crystal-notice-enemy' : 'crystal-notice-player');
      if (!el) return;
      el.className = `crystal-notice ${colorClass}`;
      el.innerText = text;
      el.style.display = 'block';
      if (!el._hideTimer) el._hideTimer = null;
      if (el._hideTimer) clearTimeout(el._hideTimer);
      el._hideTimer = setTimeout(() => { el.style.display = 'none'; }, 1600);
    }

    // 換位：選擇一名同隊存活角色進行位置互換，換位後結束自身本回合行動；被換位者不受影響，輪到自己時仍可正常行動
    function onSwapBtnClick() {
      if (gameState.isAnimating) return;
      let activeUnit = gameState.turnQueue[gameState.currentTurnIdx];
      let myTeam = activeUnit.side === 'player' ? gameState.playerTeam : gameState.enemyTeam;
      let swapCandidates = myTeam.filter(u => u.id !== activeUnit.id); // 死亡的隊友也可以換位

      if (swapCandidates.length === 0) {
        log('沒有可交換位置的隊友。', 'sys');
        return;
      }

      gameState.selectedAction = 'SWAP';
      gameState.pendingMode = 'SWAP_SELECT';
      gameState.pendingTargets = [];
      gameState.pendingTargetCount = 1;

      document.querySelectorAll('.card').forEach(c => c.classList.remove('targetable', 'selected', 'preview-random', 'preview-all'));
      removeTargetMask();
      swapCandidates.forEach(u => {
        let el = document.getElementById(`card-${u.id}`);
        if (el) el.classList.add('targetable');
      });
    }

    function executeSwap(unitA, unitB) {
      let tmp = unitA.posIdx;
      unitA.posIdx = unitB.posIdx;
      unitB.posIdx = tmp;

      log(`🔄 ${elName(unitA)} 與 ${elName(unitB)} 交換了位置！`, 'sys');
      renderBoard();

      gameState.isAnimating = true;
      setButtonsDisabled(true);
      setTimeout(() => {
        gameState.isAnimating = false;
        finishActorTurn(unitA);
        advanceToNextActor();
      }, td(500));
    }

    function onSkillBtnClick(type) {
      if (gameState.isAnimating) return;
      let activeUnit = gameState.turnQueue[gameState.currentTurnIdx];
      let skillObj = type === 'SKILL1' ? SKILL_DATABASE[activeUnit.s1] : (type === 'SKILL2' ? SKILL_DATABASE[activeUnit.s2] : SKILL_DATABASE[activeUnit.s0]);

      document.getElementById('skill-modal-title').innerText = `技能：${skillObj.name} (消耗MP: ${skillObj.cost})`;
      document.getElementById('skill-modal-desc').innerText = formatSkillDesc(skillObj) || "無詳細說明";
      document.getElementById('skill-info-modal').style.display = 'flex';

      proceedWithAction(type);
    }

    function closeSkillModal() {
      document.getElementById('skill-info-modal').style.display = 'none';
    }

    // 蓋板顏色：紅框(preview-all) = 蓋板內每個被標示的對象都保證被命中(正前方單體、全體施放)
    //          藍框(preview-random) = 從蓋板內的候選池中，真正隨機決定較少數量的最終目標
    // 僅供「前排強制」情境使用；非強制正前方的情況已在 proceedWithAction 內直接處理(優先判斷是否涵蓋全體)
    function getMaskInfo(attacker, skillObj, spec) {
      let oppTeam = attacker.side === 'player' ? gameState.enemyTeam : gameState.playerTeam;
      let aliveOpp = oppTeam.filter(u => !u.isDead);
      let enemyRowId = attacker.side === 'player' ? 'enemy-row' : 'player-row';

      let front = oppTeam.find(u => u.posIdx === attacker.posIdx && !u.isDead);
      if (!front) return null; // 正前方無人，直接轉嫁水晶，無需蓋板
      if (spec.count > 0) {
        // 正前方保證命中 + 額外隨機N名敵人 → 帶有隨機成分
        return { color: 'preview-random', units: aliveOpp, rowId: enemyRowId, label: '隨機對象' };
      }
      // 僅正前方，完全確定 → 紅框，蓋板只蓋住正前方這一張卡
      return { color: 'preview-all', units: [front], rowId: enemyRowId, label: '正前方' };
    }

    // 在指定排(rowId)內，僅蓋住 units 對應的卡牌範圍(可能只有一張，也可能是整排)，點擊蓋板後才觸發 onConfirm
    function showTargetMask(rowId, units, maskColorClass, label, onConfirm) {
      removeTargetMask();
      let row = document.getElementById(rowId);
      if (!row) { onConfirm(); return; }

      let cardEls = (units || []).map(u => document.getElementById(`card-${u.id}`)).filter(Boolean);
      if (cardEls.length === 0) { onConfirm(); return; }

      let minLeft = Math.min(...cardEls.map(el => el.offsetLeft));
      let maxRight = Math.max(...cardEls.map(el => el.offsetLeft + el.offsetWidth));
      let minTop = Math.min(...cardEls.map(el => el.offsetTop));
      let maxBottom = Math.max(...cardEls.map(el => el.offsetTop + el.offsetHeight));

      let mask = document.createElement('div');
      mask.className = `target-mask ${maskColorClass}`;
      mask.id = 'active-target-mask';
      mask.style.left = `${minLeft}px`;
      mask.style.top = `${minTop}px`;
      mask.style.width = `${maxRight - minLeft}px`;
      mask.style.height = `${maxBottom - minTop}px`;

      let labelEl = document.createElement('div');
      labelEl.className = 'target-mask-label';
      labelEl.innerText = label;
      mask.appendChild(labelEl);
      mask.onclick = () => onConfirm();
      row.appendChild(mask);
    }

    function removeTargetMask() {
      let existing = document.getElementById('active-target-mask');
      if (existing) existing.remove();
    }

    function proceedWithAction(type) {
      let activeUnit = gameState.turnQueue[gameState.currentTurnIdx];
      let skillObj = type === 'SKILL1' ? SKILL_DATABASE[activeUnit.s1] : (type === 'SKILL2' ? SKILL_DATABASE[activeUnit.s2] : SKILL_DATABASE[activeUnit.s0]);

      // AI 或自動戰鬥模式：全自動判定，不需玩家點選
      if (activeUnit.side === 'enemy' || gameState.isAuto) {
        closeSkillModal();
        executeAttackSequence(activeUnit, resolveAutoTargets(activeUnit, skillObj), skillObj);
        return;
      }

      let spec = parseTargetSpec(skillObj);
      let oppTeam = activeUnit.side === 'player' ? gameState.enemyTeam : gameState.playerTeam;
      let myTeam = activeUnit.side === 'player' ? gameState.playerTeam : gameState.enemyTeam;
      let enemyRowId = activeUnit.side === 'player' ? 'enemy-row' : 'player-row';
      let friendlyRowId = activeUnit.side === 'player' ? 'player-row' : 'enemy-row';

      document.querySelectorAll('.card').forEach(c => c.classList.remove('targetable', 'selected', 'preview-random', 'preview-all'));
      removeTargetMask();

      // 前排強制(第一碼=1)：不論其他欄位為何，只能選擇正前方，依「是否隨機」決定用蓋板還是手動點選確認
      if (spec.forceFront) {
        if (spec.isRandom) {
          let info = getMaskInfo(activeUnit, skillObj, spec);
          if (!info) {
            log(`🎯 ${elName(activeUnit)} 正前方無存活敵人，傷害自動轉嫁至【召喚水晶】！`, 'sys');
            closeSkillModal();
            executeAttackSequence(activeUnit, resolveAutoTargets(activeUnit, skillObj), skillObj);
            return;
          }
          gameState.selectedAction = type;
          gameState.pendingMode = 'MASK_CONFIRM';
          info.units.forEach(u => {
            let el = document.getElementById(`card-${u.id}`);
            if (el) el.classList.add(info.color);
          });
          showTargetMask(info.rowId, info.units, info.color === 'preview-all' ? 'mask-all' : 'mask-random', info.label, () => {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('preview-random', 'preview-all'));
            removeTargetMask();
            gameState.selectedAction = null;
            gameState.pendingMode = null;
            closeSkillModal();
            executeAttackSequence(activeUnit, resolveAutoTargets(activeUnit, skillObj), skillObj);
          });
          return;
        }

        let front = oppTeam.find(u => u.posIdx === activeUnit.posIdx);
        if (front && !front.isDead) {
          gameState.selectedAction = type;
          gameState.pendingMode = 'FRONT_CONFIRM';
          gameState.pendingTargets = [];
          gameState.pendingTargetCount = 1;
          gameState.pendingExtraCount = spec.count > 0 ? spec.count : 0;

          let el = document.getElementById(`card-${front.id}`);
          if (el) el.classList.add('targetable');
        } else {
          log(`🎯 ${elName(activeUnit)} 正前方無存活敵人，傷害自動轉嫁至【召喚水晶】！`, 'sys');
          closeSkillModal();
          executeAttackSequence(activeUnit, resolveAutoTargets(activeUnit, skillObj), skillObj);
        }
        return;
      }

      // 是否自身施放(第四碼=1)：不論其他欄位為何，固定施放於自己，走蓋板確認流程(紅框,僅蓋住自己這張卡)
      if (spec.isSelf) {
        gameState.selectedAction = type;
        gameState.pendingMode = 'MASK_CONFIRM';
        let selfEl = document.getElementById(`card-${activeUnit.id}`);
        if (selfEl) selfEl.classList.add('preview-all');
        showTargetMask(friendlyRowId, [activeUnit], 'mask-all', '自身', () => {
          document.querySelectorAll('.card').forEach(c => c.classList.remove('preview-random', 'preview-all'));
          removeTargetMask();
          gameState.selectedAction = null;
          gameState.pendingMode = null;
          closeSkillModal();
          executeAttackSequence(activeUnit, [activeUnit], skillObj);
        });
        return;
      }

      // 非強制正前方、非自身施放：先判斷「對象數量是否已涵蓋該側全部存活單位」——
      // 只要涵蓋全部，不論是否隨機，一律顯示紅框蓋板「全體施放」，點擊蓋板才觸發實際施放(沒有真正可挑選的空間，但仍要走一次確認流程)
      if (spec.count > 0) {
        let aliveOpp = oppTeam.filter(u => !u.isDead);
        if (aliveOpp.length === 0) {
          closeSkillModal();
          executeAttackSequence(activeUnit, [{ isCrystal: true, side: oppTeam[0].side }], skillObj);
          return;
        }
        if (spec.count >= aliveOpp.length) {
          gameState.selectedAction = type;
          gameState.pendingMode = 'MASK_CONFIRM';
          aliveOpp.forEach(u => {
            let el = document.getElementById(`card-${u.id}`);
            if (el) el.classList.add('preview-all');
          });
          showTargetMask(enemyRowId, aliveOpp, 'mask-all', '全體施放', () => {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('preview-random', 'preview-all'));
            removeTargetMask();
            gameState.selectedAction = null;
            gameState.pendingMode = null;
            closeSkillModal();
            executeAttackSequence(activeUnit, resolveAutoTargets(activeUnit, skillObj), skillObj);
          });
          return;
        }

        // 是否隨機 = 1：顯示蓋板(藍框，隨機候選池)，點擊蓋板才觸發實際隨機判定
        if (spec.isRandom) {
          gameState.selectedAction = type;
          gameState.pendingMode = 'MASK_CONFIRM';
          aliveOpp.forEach(u => {
            let el = document.getElementById(`card-${u.id}`);
            if (el) el.classList.add('preview-random');
          });
          showTargetMask(enemyRowId, aliveOpp, 'mask-random', '隨機對象', () => {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('preview-random', 'preview-all'));
            removeTargetMask();
            gameState.selectedAction = null;
            gameState.pendingMode = null;
            closeSkillModal();
            executeAttackSequence(activeUnit, resolveAutoTargets(activeUnit, skillObj), skillObj);
          });
          return;
        }

        // 是否隨機 = 0：手動選擇「對象數量」個目標，選滿後直接出招
        gameState.selectedAction = type;
        gameState.pendingMode = 'ENEMY_SELECT';
        gameState.pendingTargets = [];
        gameState.pendingTargetCount = spec.count;
        aliveOpp.forEach(t => {
          let el = document.getElementById(`card-${t.id}`);
          if (el) el.classList.add('targetable');
        });
        return;
      }

      if (spec.count < 0) {
        let mag = Math.abs(spec.count);
        let aliveMy = myTeam.filter(u => !u.isDead);
        if (aliveMy.length === 0) {
          closeSkillModal();
          executeAttackSequence(activeUnit, resolveAutoTargets(activeUnit, skillObj), skillObj);
          return;
        }

        // 數量已涵蓋我方全部存活單位：一律顯示紅框蓋板「全體施放」，不論是否隨機
        if (mag >= aliveMy.length) {
          gameState.selectedAction = type;
          gameState.pendingMode = 'MASK_CONFIRM';
          aliveMy.forEach(u => {
            let el = document.getElementById(`card-${u.id}`);
            if (el) el.classList.add('preview-all');
          });
          showTargetMask(friendlyRowId, aliveMy, 'mask-all', '全體施放', () => {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('preview-random', 'preview-all'));
            removeTargetMask();
            gameState.selectedAction = null;
            gameState.pendingMode = null;
            closeSkillModal();
            executeAttackSequence(activeUnit, resolveAutoTargets(activeUnit, skillObj), skillObj);
          });
          return;
        }

        // 是否隨機 = 1：顯示蓋板(藍框，隨機候選池)，點擊蓋板才觸發實際隨機判定
        if (spec.isRandom) {
          gameState.selectedAction = type;
          gameState.pendingMode = 'MASK_CONFIRM';
          aliveMy.forEach(u => {
            let el = document.getElementById(`card-${u.id}`);
            if (el) el.classList.add('preview-random');
          });
          showTargetMask(friendlyRowId, aliveMy, 'mask-random', '隨機對象', () => {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('preview-random', 'preview-all'));
            removeTargetMask();
            gameState.selectedAction = null;
            gameState.pendingMode = null;
            closeSkillModal();
            executeAttackSequence(activeUnit, resolveAutoTargets(activeUnit, skillObj), skillObj);
          });
          return;
        }

        // 是否隨機 = 0：手動選擇「對象數量」個目標，選滿後直接出招
        gameState.selectedAction = type;
        gameState.pendingMode = 'FRIENDLY_SELECT';
        gameState.pendingTargets = [];
        gameState.pendingTargetCount = mag;
        aliveMy.forEach(t => {
          let el = document.getElementById(`card-${t.id}`);
          if (el) el.classList.add('targetable');
        });
        return;
      }

      // 對象數量 = 0(且非前排強制、非自身施放)：資料表理論上不應出現此組合，記錄警告並採用保底判定，避免卡住回合
      log(`⚠️ 【${skillObj.name}】未指定有效施放對象(攻擊正前方/是否自身施放/攻擊對象數量皆為0)，請檢查 xlsx 設定，暫以保底規則處理。`, 'sys');
      closeSkillModal();
      executeAttackSequence(activeUnit, resolveAutoTargets(activeUnit, skillObj), skillObj);
    }

    function handleCardClick(targetUnit) {
      if (!gameState.selectedAction || gameState.isAnimating) return;
      let activeUnit = gameState.turnQueue[gameState.currentTurnIdx];
      let mode = gameState.pendingMode;

      // 換位：選擇同隊(可為存活或死亡中)的隊友進行換位，換位後結束自身本回合行動
      if (mode === 'SWAP_SELECT') {
        if (targetUnit.side !== activeUnit.side || targetUnit.id === activeUnit.id) return;
        gameState.selectedAction = null;
        gameState.pendingMode = null;
        document.querySelectorAll('.card').forEach(c => c.classList.remove('targetable', 'selected'));
        executeSwap(activeUnit, targetUnit);
        return;
      }

      let action = gameState.selectedAction;
      let skillObj = action === 'SKILL1' ? SKILL_DATABASE[activeUnit.s1] : (action === 'SKILL2' ? SKILL_DATABASE[activeUnit.s2] : SKILL_DATABASE[activeUnit.s0]);

      if (mode === 'MASK_CONFIRM') return; // 蓋板模式下需點擊蓋板本身，不由卡牌觸發
      if (targetUnit.isDead) return;
      if (mode === 'ENEMY_SELECT' && targetUnit.side === activeUnit.side) return;
      if (mode === 'FRIENDLY_SELECT' && targetUnit.side !== activeUnit.side) return;
      if (mode === 'FRONT_CONFIRM' && (targetUnit.side === activeUnit.side || targetUnit.posIdx !== activeUnit.posIdx)) return;
      if (gameState.pendingTargets.some(t => t.id === targetUnit.id)) return; // 避免重複點選同一目標

      gameState.pendingTargets.push(targetUnit);
      let pickedEl = document.getElementById(`card-${targetUnit.id}`);
      if (pickedEl) { pickedEl.classList.remove('targetable'); pickedEl.classList.add('selected'); }

      let remaining = gameState.pendingTargetCount - gameState.pendingTargets.length;
      if (remaining > 0) {
        return;
      }

      gameState.selectedAction = null;
      document.querySelectorAll('.card').forEach(c => c.classList.remove('targetable', 'selected'));
      closeSkillModal();

      let finalTargets = gameState.pendingTargets;
      gameState.pendingTargets = [];

      // 前排強制技能若還帶有額外隨機目標數量，於玩家確認正前方後自動補上隨機敵方目標
      if (mode === 'FRONT_CONFIRM' && gameState.pendingExtraCount > 0) {
        let oppTeam = activeUnit.side === 'player' ? gameState.enemyTeam : gameState.playerTeam;
        let pool = oppTeam.filter(u => !u.isDead && u.id !== finalTargets[0].id).sort(() => 0.5 - Math.random());
        finalTargets = finalTargets.concat(pool.slice(0, gameState.pendingExtraCount));
      }
      gameState.pendingExtraCount = 0;
      gameState.pendingMode = null;

      executeAttackSequence(activeUnit, finalTargets, skillObj);
    }
    function resolveAutoTargets(attacker, skillObj) {
      let spec = parseTargetSpec(skillObj);
      let oppTeam = attacker.side === 'player' ? gameState.enemyTeam : gameState.playerTeam;
      let myTeam = attacker.side === 'player' ? gameState.playerTeam : gameState.enemyTeam;
      let aliveOpp = oppTeam.filter(u => !u.isDead);
      let aliveMy = myTeam.filter(u => !u.isDead);

      // 前排強制: 目標只能選定正前方，無前方存活敵人則轉嫁召喚水晶
      if (spec.forceFront) {
        let front = oppTeam.find(u => u.posIdx === attacker.posIdx);
        let targets = [];
        if (front && !front.isDead) {
          targets.push(front);
        } else {
          log(`🎯 ${elName(attacker)} 正前方無存活敵人，傷害自動轉嫁至【召喚水晶】！`, 'sys');
          targets.push({ isCrystal: true, side: oppTeam[0].side });
        }
        if (spec.count > 0) {
          let pool = aliveOpp.filter(u => u !== front).sort(() => 0.5 - Math.random());
          targets = targets.concat(pool.slice(0, spec.count));
        }
        return targets;
      }

      // 正數 = 敵方，數量 = 隨機/選定施放對象數
      if (spec.count > 0) {
        if (aliveOpp.length === 0) return [{ isCrystal: true, side: oppTeam[0].side }];
        let shuffled = [...aliveOpp].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, Math.min(spec.count, shuffled.length));
      }

      // 是否自身施放: 不論其他欄位為何，固定回傳自己
      if (spec.isSelf) return [attacker];

      // 正數 = 敵方，數量 = 隨機/選定施放對象數
      if (spec.count > 0) {
        if (aliveOpp.length === 0) return [{ isCrystal: true, side: oppTeam[0].side }];
        let shuffled = [...aliveOpp].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, Math.min(spec.count, shuffled.length));
      }

      // 負數 = 我方，數量絕對值 = 施放對象數
      if (spec.count < 0) {
        let mag = Math.abs(spec.count);
        if (mag >= aliveMy.length) return aliveMy.length > 0 ? aliveMy : [attacker]; // 數量已涵蓋全部存活單位 → 全體
        let shuffled = [...aliveMy].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, Math.min(mag, shuffled.length));
      }

      // count === 0 且非強制正前方(理論上不會出現於資料表，保留保底處理)
      return aliveOpp.length > 0 ? [aliveOpp[0]] : [{ isCrystal: true, side: oppTeam[0].side }];
    }

    function findUnitById(id) {
      return gameState.playerTeam.find(u => u.id === id) || gameState.enemyTeam.find(u => u.id === id);
    }

    // buff 1998(受護衛)：施放時需記錄是誰施放護衛(守護者)，之後由守護者代替承受目標所受到的一切傷害
    function addGuardBuff(unit, guardian) {
      if (!unit || unit.isDead || !guardian || guardian.isDead) return;
      let buffInfo = BUFF_DATABASE[1998];
      if (!buffInfo) return;

      if (!unit.buffs) unit.buffs = [];
      let existing = unit.buffs.find(b => b.buffId === 1998);

      if (existing) {
        existing.guardianId = guardian.id;
        if (buffInfo.reflashAble !== false) existing.duration = buffInfo.duration;
      } else {
        unit.buffs.push({ buffId: 1998, stack: 1, duration: buffInfo.duration, guardianId: guardian.id });
      }
      log(`🛡️ ${elName(guardian)} 挺身守護了 ${elName(unit)}！`, 'buff');
    }

    function addBuffToUnit(unit, buffId) {
      if (!unit || unit.isDead || !buffId) return;
      let buffInfo = BUFF_DATABASE[buffId];
      if (!buffInfo) return;

      if (!unit.buffs) unit.buffs = [];
      let existing = unit.buffs.find(b => b.buffId === buffId);

      if (existing) {
        existing.stack = Math.min(buffInfo.maxStack, existing.stack + 1);
        // reflashAble=false 時，重新施放不會刷新剩餘回合數(維持原本倒數)
        if (buffInfo.reflashAble !== false) {
          existing.duration = buffInfo.duration;
        }
      } else {
        unit.buffs.push({
          buffId: buffId,
          stack: 1,
          duration: buffInfo.duration
        });
      }
      log(`✨ ${elName(unit)} 獲得了【${buffInfo.name}】效果！`, 'buff');
    }

    function autoExecuteTurn(activeUnit) {
      if (gameState.isAnimating) return;

      let s0 = SKILL_DATABASE[activeUnit.s0];
      let s1 = SKILL_DATABASE[activeUnit.s1];
      let s2 = SKILL_DATABASE[activeUnit.s2];

      let chosenSkill = s0;
      if (activeUnit.currentMp >= s2.cost && Math.random() > 0.4) chosenSkill = s2;
      else if (activeUnit.currentMp >= s1.cost && Math.random() > 0.3) chosenSkill = s1;

      let targets = resolveAutoTargets(activeUnit, chosenSkill);
      if (!targets || targets.length === 0) return;
      executeAttackSequence(activeUnit, targets, chosenSkill);
    }

    // 攻擊次數(xlsx「攻擊次數/重複執行次數」欄位)展開：
    //   非隨機(玩家手動選定的目標) → 每次攻擊固定命中同一批已選定的目標
    //   隨機(isRandom=1) → 第一次沿用呼叫方已決定的目標，之後每一次都要重新獨立隨機一次(不可重複沿用同一次隨機結果)
    function expandTargetsForHits(attacker, targets, skillObj) {
      if (!skillObj.hits || skillObj.hits <= 1) return targets;
      let spec = parseTargetSpec(skillObj);
      if (!spec.isRandom) {
        let expanded = [];
        for (let i = 0; i < skillObj.hits; i++) expanded = expanded.concat(targets);
        return expanded;
      }
      let expanded = [...targets];
      for (let i = 1; i < skillObj.hits; i++) {
        expanded = expanded.concat(resolveAutoTargets(attacker, skillObj));
      }
      return expanded;
    }

    function executeAttackSequence(attacker, targets, skillObj) {
      closeSkillModal();
      removeTargetMask();
      gameState.isAnimating = true;
      setButtonsDisabled(true);

      // 判斷本次攻擊是否直接命中召喚水晶(非隨機目標的技能才顯示提示，隨機目標排除在外)
      let spec = parseTargetSpec(skillObj);
      if (!spec.isRandom) {
        let crystalTarget = targets.find(t => t.isCrystal);
        if (crystalTarget) {
          showCrystalNotice('水晶直接傷害', 'notice-red', crystalTarget.side);
        }
      }

      targets = expandTargetsForHits(attacker, targets, skillObj);

      if (skillObj.cost > 0) {
        attacker.currentMp -= skillObj.cost;
      }

      let hasDamageEffect = (skillObj.ad && skillObj.ad > 0) || (skillObj.ap && skillObj.ap > 0);

      const overlay = document.getElementById('anim-overlay');
      const attackerCard = document.getElementById(`card-${attacker.id}`);

      targets.forEach((target, index) => {
        setTimeout(() => {
          let actualTarget = target;
          
          if (!actualTarget.isCrystal && actualTarget.isDead) {
            actualTarget = { isCrystal: true, side: actualTarget.side };
            log(`🎯 選中的目標已死亡，傷害自動轉嫁至【召喚水晶】！`, 'sys');
          }

          let targetEl = actualTarget.isCrystal ? document.getElementById(`${actualTarget.side}-crystal-art`) : document.getElementById(`card-${actualTarget.id}`);
          if (!targetEl || !attackerCard) return;

          let rectA = attackerCard.getBoundingClientRect();
          let rectT = targetEl.getBoundingClientRect();
          let rectO = overlay.getBoundingClientRect();

          let startX = rectA.left + rectA.width / 2 - rectO.left;
          let startY = rectA.top + rectA.height / 2 - rectO.top;
          let endX = rectT.left + rectT.width / 2 - rectO.left;
          let endY = rectT.top + rectT.height / 2 - rectO.top;

          if (hasDamageEffect) {
            let proj = document.createElement('div');
            if (skillObj.type === 'HEAL') proj.className = 'projectile-heal';
            else if (skillObj.type === 'AP' || skillObj.type === 'MP_RECOVER') proj.className = 'projectile-ap';
            else if (skillObj.type === 'SHIELD') proj.className = 'projectile-heal';
            else proj.className = 'projectile-ad';

            proj.style.left = `${startX}px`;
            proj.style.top = `${startY}px`;
            overlay.appendChild(proj);

            setTimeout(() => {
              proj.style.left = `${endX}px`;
              proj.style.top = `${endY}px`;
            }, td(20));

            setTimeout(() => {
              proj.remove();

              let hitFx = document.createElement('div');
              if (skillObj.type === 'HEAL') hitFx.className = 'hit-effect-heal';
              else if (skillObj.type === 'SHIELD') hitFx.className = 'hit-effect-shield';
              else if (skillObj.type === 'AP') hitFx.className = 'hit-effect-ap';
              else hitFx.className = 'hit-effect-ad';

              hitFx.style.left = `${endX - 25}px`;
              hitFx.style.top = `${endY - 25}px`;
              overlay.appendChild(hitFx);
              setTimeout(() => hitFx.remove(), td(400));

              applySkillEffect(attacker, actualTarget, skillObj, endX, endY);
            }, td(280));
          } else {
            applySkillEffect(attacker, actualTarget, skillObj, endX, endY);
          }

        }, td(index * 100));
      });

      let delayTime = hasDamageEffect ? (700 + targets.length * 100) : (300 + targets.length * 50);

      setTimeout(() => {
        gameState.isAnimating = false;
        finishActorTurn(attacker);
        advanceToNextActor();
      }, td(delayTime));
    }

    // 屬性圖示(水/火/木)：固定造型的內嵌SVG圖示，尺寸可依情境調整(預設與自身頭像同大小)
    function elementIconHtml(element, size) {
      size = size || 16;
      if (element === '水') {
        return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="vertical-align:middle;flex-shrink:0;"><path d="M12 2C12 2 4 12.5 4 17C4 20.87 7.58 23 12 23C16.42 23 20 20.87 20 17C20 12.5 12 2 12 2Z" fill="#3b82f6" stroke="#bfdbfe" stroke-width="1"/></svg>`;
      }
      if (element === '火') {
        return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="vertical-align:middle;flex-shrink:0;"><path d="M12 2C12 2 6 8.5 6 13.5C6 17.6 8.7 21 12 21C15.3 21 18 17.6 18 13.5C18 11.3 17 9.6 16 8.5C16.2 10.3 15 11.5 13.8 11.3C14.6 8 13 4.8 12 2Z" fill="#f97316" stroke="#fed7aa" stroke-width="1"/></svg>`;
      }
      if (element === '木') {
        return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="vertical-align:middle;flex-shrink:0;"><path d="M12 2L4 10.5C4 10.5 4 14.3 8 16.2C8 16.2 6 19 6 22H18C18 19 16 16.2 16 16.2C20 14.3 20 10.5 20 10.5L12 2Z" fill="#22c55e" stroke="#bbf7d0" stroke-width="1"/></svg>`;
      }
      return '';
    }

    // 於人物名稱前方加上屬性符號(水/火/木)；沒有element欄位(如召喚水晶)則不加前綴
    // 純文字版本：用於戰鬥紀錄/title提示等只能顯示文字的地方
    function elName(entity) {
      if (!entity) return '';
      return (entity.element || '') + (entity.name || '');
    }
    // 圖示版本：用於卡牌/清單等會渲染HTML的視覺化名稱標籤，圖示尺寸預設與該處頭像相同大小
    function elNameHtml(entity, iconSize) {
      if (!entity) return '';
      let icon = elementIconHtml(entity.element, iconSize);
      return `<span style="display:inline-flex;align-items:center;justify-content:center;gap:3px;">${icon}<span>${entity.name || ''}</span></span>`;
    }

    // 屬性剋制規則：水剋火、火剋木、木剋水
    const ELEMENT_COUNTER = { '水': '火', '火': '木', '木': '水' };
    function getElementDamageMultiplier(attacker, target) {
      if (!attacker.element || !target.element) return 1;
      if (ELEMENT_COUNTER[attacker.element] === target.element) return 1.3;  // 剋制：+30%
      if (ELEMENT_COUNTER[target.element] === attacker.element) return 0.7; // 被剋：-30%
      return 1;
    }

    function applySkillEffect(attacker, target, skillObj, endX, endY) {
      // 受護衛效果(buff 1998)：傷害類技能(AD/AP)命中有護衛效果的目標時，改由守護者代替承受本次攻擊的一切效果
      if (!target.isCrystal && (skillObj.type === 'AD' || skillObj.type === 'AP') && target.buffs) {
        let guardBuff = target.buffs.find(b => b.buffId === 1998);
        if (guardBuff) {
          let guardian = findUnitById(guardBuff.guardianId);
          if (guardian && !guardian.isDead) {
            log(`🛡️ ${elName(guardian)} 代替 ${elName(target)} 承受了這次攻擊！`, 'sys');
            target = guardian;
          }
        }
      }

      if (skillObj.type === 'HEAL') {
        let statAtk = attacker.matk;
        let healVal = Math.floor(statAtk * (skillObj.ap || 1.0));
        target.currentHp = Math.min(target.maxHp, target.currentHp + healVal);

        showPopText(endX, endY, `+${healVal}`, 'heal-num');
        log(`${elName(attacker)} 施展【${skillObj.name}】，為 ${elName(target)} 恢復了 ${healVal} 點 HP！`, 'heal');

      } else if (skillObj.type === 'SHIELD') {
        let statAtk = skillObj.ad > 0 ? attacker.atk : attacker.matk;
        let rate = skillObj.ad > 0 ? skillObj.ad : skillObj.ap;
        let shieldVal = Math.floor(statAtk * rate);
        target.shield = shieldVal; // 新的護盾取代原有護盾值(不疊加)

        showPopText(endX, endY, `+${shieldVal}護盾`, 'shield-num');
        log(`${elName(attacker)} 施展【${skillObj.name}】，為 ${elName(target)} 附加了 ${shieldVal} 點護盾！`, 'shield');

      } else if (skillObj.type === 'MP_RECOVER') {
        let mpVal = skillObj.mp_recover || 30;
        target.currentMp = Math.min(target.maxMp, target.currentMp + mpVal);

        showPopText(endX, endY, `+${mpVal}MP`, 'mp-num');
        log(`${elName(attacker)} 施展【${skillObj.name}】，為 ${elName(target)} 恢復了 ${mpVal} 點 MP！`, 'heal');

      } else if (skillObj.type === 'BUFF') {
        log(`${elName(attacker)} 施展技能【${skillObj.name}】！`, 'buff');
      } else {
        let isAp = skillObj.type === 'AP';
        let selfAtk = isAp ? attacker.matk : attacker.atk;
        
        let enemyDef = target.isCrystal ? 50 : (isAp ? target.mdef : target.def);
        let skillCoeff = isAp ? skillObj.ap : skillObj.ad;

        let baseCriChance = 0.10;
        let criBuff = attacker.buffs ? attacker.buffs.filter(b => b.buffId === 1009).reduce((s, b) => s + b.stack * 0.05, 0) : 0;
        let isCritical = Math.random() < (baseCriChance + criBuff);
        let criMult = isCritical ? 1.5 : 1.0;

        let baseMult = 3.0;

        // 水晶直接傷害規則：非隨機技能直接命中召喚水晶時，追加100%傷害(該次傷害共2倍)
        let isDirectCrystalHit = target.isCrystal && !parseTargetSpec(skillObj).isRandom;
        if (isDirectCrystalHit) baseMult *= 2;

        // 屬性剋制：水剋火/火剋木/木剋水，剋制方+30%傷害、被剋方-30%傷害；對水晶不觸發(水晶沒有屬性)
        let elementMult = target.isCrystal ? 1 : getElementDamageMultiplier(attacker, target);

        let rawDmg = (selfAtk * selfAtk) / (enemyDef + selfAtk) * skillCoeff * criMult * baseMult * elementMult;
        let dmg = Math.floor(rawDmg);
        dmg = Math.max(1, dmg);

        if (target.isCrystal) {
          if (target.side === 'enemy') gameState.enemyCrystal.hp = Math.max(0, gameState.enemyCrystal.hp - dmg);
          else gameState.playerCrystal.hp = Math.max(0, gameState.playerCrystal.hp - dmg);

          showPopText(endX, endY, `-${dmg}`, isCritical ? 'cri-num' : 'dmg-num');
          log(`${elName(attacker)} 攻擊【召喚水晶】(防禦:${enemyDef})，造成 ${dmg} 點傷害！${isCritical ? '💥 (爆擊!)' : ''}`, isCritical ? 'cri' : 'dmg');
        } else {
          // 支援 isMpDamage 規則：如果 isMpDamage 為 1，則扣除 MP 而不扣除 HP
          if (skillObj.isMpDamage === 1) {
            target.currentMp = Math.max(0, target.currentMp - dmg);
            showPopText(endX, endY, `-${dmg}MP`, 'mp-num');
            log(`${elName(attacker)} 使用【${skillObj.name}】命中 ${elName(target)}，扣除 ${dmg} 點 MP (HP未受傷害)！`, 'dmg');
          } else {
            let remainDmg = dmg;
            if (target.shield > 0) {
              if (target.shield >= remainDmg) {
                target.shield -= remainDmg;
                log(`${elName(target)} 的護盾吸收了 ${remainDmg} 點傷害！`, 'shield');
                remainDmg = 0;
              } else {
                log(`${elName(target)} 的護盾破裂！吸收 ${target.shield} 點傷害。`, 'shield');
                remainDmg -= target.shield;
                target.shield = 0;
              }
            }

            let overflowDmg = 0;
            if (remainDmg > target.currentHp) {
              overflowDmg = remainDmg - target.currentHp;
              target.currentHp = 0;
            } else {
              target.currentHp -= remainDmg;
            }

            showPopText(endX, endY, `-${dmg}`, isCritical ? 'cri-num' : 'dmg-num');

            if (target.currentHp === 0 && !target.isDead) {
              target.isDead = true;
              target.reviveCd = target.cd;
              target.agiGauge = 0; // 死亡時AGI條歸零
              log(`💀 ${elName(target)} 遭到擊殺，將在 ${target.cd} 回合後重生！`, 'sys');
            }

            log(`${elName(attacker)} 使用【${skillObj.name}】命中 ${elName(target)}，造成 ${dmg} 點傷害！${isCritical ? '💥 (爆擊!)' : ''}`, isCritical ? 'cri' : 'dmg');

            // 傷害溢出：本次攻擊造成角色死亡時，多餘的傷害直接傷害到該側的召喚水晶
            if (overflowDmg > 0) {
              let crystal = target.side === 'enemy' ? gameState.enemyCrystal : gameState.playerCrystal;
              crystal.hp = Math.max(0, crystal.hp - overflowDmg);
              let cPos = getCrystalPos(target.side);
              if (cPos) showPopText(cPos.x, cPos.y, `-${overflowDmg}`, 'dmg-num');
              log(`💥 傷害溢出！多餘的 ${overflowDmg} 點傷害直接穿透至【召喚水晶】！`, 'dmg');
              showCrystalNotice('水晶傷害', 'notice-pink', target.side);
            }
          }
        }
      }

      // current_hp效果：依目標「目前HP」的比例增減HP(正=恢復/負=傷害)，與上方主要效果各自獨立計算疊加
      if (skillObj.current_hp && !target.isCrystal && !target.isDead) {
        let hpChange = Math.round(target.currentHp * skillObj.current_hp);
        if (hpChange > 0) {
          let healed = Math.min(target.maxHp - target.currentHp, hpChange);
          if (healed > 0) {
            target.currentHp += healed;
            showPopText(endX, endY, `+${healed}`, 'heal-num');
            log(`${elName(attacker)} 使用【${skillObj.name}】，為 ${elName(target)} 額外恢復了 ${healed} 點HP(目前HP的${Math.round(skillObj.current_hp * 100)}%)！`, 'heal');
          }
        } else if (hpChange < 0) {
          let dmgAmt = Math.min(target.currentHp, -hpChange);
          target.currentHp -= dmgAmt;
          showPopText(endX, endY, `-${dmgAmt}`, 'dmg-num');
          log(`${elName(attacker)} 使用【${skillObj.name}】，對 ${elName(target)} 額外造成了 ${dmgAmt} 點傷害(目前HP的${Math.round(-skillObj.current_hp * 100)}%)！`, 'dmg');
          if (target.currentHp === 0 && !target.isDead) {
            target.isDead = true;
            target.reviveCd = target.cd;
            target.agiGauge = 0; // 死亡時AGI條歸零
            log(`💀 ${elName(target)} 遭到擊殺，將在 ${target.cd} 回合後重生！`, 'sys');
          }
        }
      }

      if (skillObj.add_buff_id && skillObj.add_buff_id.length > 0 && !target.isCrystal) {
        skillObj.add_buff_id.forEach(bId => {
          if (bId === 1998) {
            addGuardBuff(target, attacker);
          } else {
            addBuffToUnit(target, bId);
          }
        });
        showPopText(endX, endY, `BUFF`, 'buff-num');
      }

      // 驅散：命中時若目標身上有 remove_buff_id 列表中的任一 buff，將其移除
      // (依技能實際施放對象而定：對敵方使用=驅散敵方增益，對我方使用=為我方淨化負面狀態)
      if (skillObj.remove_buff_id && skillObj.remove_buff_id.length > 0 && !target.isCrystal && target.buffs && target.buffs.length > 0) {
        let removedNames = [];
        skillObj.remove_buff_id.forEach(bId => {
          let idx = target.buffs.findIndex(b => b.buffId === bId);
          if (idx !== -1) {
            let info = BUFF_DATABASE[bId];
            removedNames.push(info ? info.name : bId);
            target.buffs.splice(idx, 1);
            if (bId === 1999) target.shield = 0; // buff 1999(護盾)被驅散時，護盾值也一併歸零
          }
        });
        if (removedNames.length > 0) {
          log(`✨ ${elName(attacker)} 使用【${skillObj.name}】驅散了 ${elName(target)} 身上的【${removedNames.join('、')}】效果！`, 'buff');
          showPopText(endX, endY, `驅散`, 'buff-num');
        }
      }

      renderBoard();
    }

    function getCrystalPos(side) {
      const overlay = document.getElementById('anim-overlay');
      let el = document.getElementById(`${side}-crystal-art`);
      if (!el || !overlay) return null;
      let rectT = el.getBoundingClientRect();
      let rectO = overlay.getBoundingClientRect();
      return { x: rectT.left + rectT.width / 2 - rectO.left, y: rectT.top + rectT.height / 2 - rectO.top };
    }

    function showPopText(x, y, text, className) {
      const overlay = document.getElementById('anim-overlay');
      let el = document.createElement('div');
      el.className = className;
      el.innerText = text;
      el.style.left = `${x - 10}px`;
      el.style.top = `${y - 20}px`;
      overlay.appendChild(el);
      setTimeout(() => el.remove(), td(800));
    }

    // 更新畫面上實際套用的戰鬥速度倍率(影響 CSS 動畫時長，JS 延遲則透過 td() 換算)
    function applySpeedToCSS() {
      const container = document.querySelector('.game-container');
      if (container) container.style.setProperty('--speed', gameState.speedMultiplier);
    }

    // 自動戰鬥按鈕三段式循環：OFF → ON(1倍速) → ON(2倍速，演出與延遲皆加快) → OFF
    function toggleAuto() {
      const btn = document.getElementById('btn-auto');

      if (!gameState.isAuto) {
        gameState.isAuto = true;
        gameState.speedMultiplier = 1;
        btn.innerText = '自動戰鬥: ON';
        btn.classList.add('auto-on');
        applySpeedToCSS();
        let activeUnit = gameState.turnQueue[gameState.currentTurnIdx];
        if (activeUnit && !gameState.isAnimating) {
          autoExecuteTurn(activeUnit);
        }
      } else if (gameState.speedMultiplier === 1) {
        gameState.speedMultiplier = 2;
        btn.innerText = '自動戰鬥: ON (2倍速)';
        applySpeedToCSS();
      } else {
        gameState.isAuto = false;
        gameState.speedMultiplier = 1;
        btn.innerText = '自動戰鬥: OFF';
        btn.classList.remove('auto-on');
        applySpeedToCSS();
      }
    }

    function checkGameOver() {
      let playerAlive = gameState.playerTeam.some(u => !u.isDead);
      let enemyAlive = gameState.enemyTeam.some(u => !u.isDead);

      if (!enemyAlive || gameState.enemyCrystal.hp <= 0) {
        log("🏆 敵方陣營潰敗，我方獲得勝利！", "sys");
        setButtonsDisabled(true);
        showResultModal(true);
        return true;
      } else if (!playerAlive || gameState.playerCrystal.hp <= 0) {
        log("💀 我方陣營破滅，戰鬥失敗！", "sys");
        setButtonsDisabled(true);
        showResultModal(false);
        return true;
      }
      return false;
    }

    function log(msg, type = '') {
      const box = document.getElementById('log-box');
      const div = document.createElement('div');
      div.className = `log-msg ${type}`;
      div.innerText = `> ${msg}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    renderQuestList();
    showScreen('quest-select');
  </script>
</body>
</html>
